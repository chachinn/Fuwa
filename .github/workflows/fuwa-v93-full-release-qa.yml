name: Fuwa v93 full stability release QA

on:
  push:
    branches:
      - qa/v93-stability-cleanup-package

jobs:
  full-release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v93-stability-cleanup-package
          fetch-depth: 0

      - name: Apply production patch
        run: python3 tools/fuwa_v93_stability_patch.py

      - name: Static syntax, structure, and data-safety QA
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check firebase-fuwa.js
          node --check data/scrapbook-data.js
          node - <<'JS'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (manifest.orientation !== 'any') throw new Error('manifest orientation is not any');
          if (!Array.isArray(manifest.icons) || !manifest.icons.some(x => x.src.includes('icon-192.png')) || !manifest.icons.some(x => x.src.includes('icon-512.png'))) throw new Error('manifest PNG icons missing');
          console.log('manifest valid: orientation any + PNG icons');
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, json, collections

          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('app.js').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          old_js = subprocess.check_output(['git','show','HEAD:app.js'], text=True)
          old_html = subprocess.check_output(['git','show','HEAD:index.html'], text=True)

          assert 'FUWA_BUILD: v93-stability-performance-qa' in html
          assert 'What’s new in Fuwa 1.1.8' in html
          assert 'fuwa-v1.1.8-2026-08-14' in js
          assert 'const DATABASE_VERSION = 13;' in js
          assert 'fuwa-shell-v93' in sw and 'fuwa-v1.1.8-2026-08-14' in sw
          assert 'SLEEP_AUDIO_ASSETS' not in sw
          assert 'isSleepAudioRequest' in sw
          assert 'url.pathname.includes("/audio/sleep/")' in sw
          assert 'await Promise.all(OPTIONAL_ASSETS.map' in sw
          assert '[...OPTIONAL_ASSETS' not in sw

          # No new destructive storage APIs.
          for token in ('localStorage.clear(', 'indexedDB.deleteDatabase('):
              assert js.count(token) <= old_js.count(token), token

          # Static IDs must remain unique and the patch must not create new duplicate IDs.
          def duplicate_ids(text):
              ids = re.findall(r'\bid="([^"]+)"', text)
              return {k:v for k,v in collections.Counter(ids).items() if v > 1}
          assert duplicate_ids(html) == duplicate_ids(old_html), (duplicate_ids(old_html), duplicate_ids(html))

          # All HQ ambience and its attribution file stay in the correct folder.
          audio = Path('audio/sleep')
          expected = {
              'gentle-rain.mp3','ocean-drift.mp3','warm-hearth.mp3','evening-breeze.mp3',
              'quiet-forest.mp3','cozy-room.mp3','deep-hush.mp3','soft-air.mp3','README-LICENSES.txt'
          }
          present = {p.name for p in audio.iterdir() if p.is_file()}
          assert expected <= present, expected - present
          for name in expected:
              assert Path('audio/sleep', name).stat().st_size > (1000 if name.endswith('.mp3') else 100)

          # Patch scope is deliberately small; content, Firebase, audio, icons and scrapbook data are untouched.
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == {'index.html','app.js','manifest.json','service-worker.js'}, changed
          for path in ('style.css','firebase-fuwa.js','data/scrapbook-data.js','data/scrapbook-data.json'):
              subprocess.run(['git','diff','--exit-code','HEAD','--',path], check=True)
          subprocess.run(['git','diff','--exit-code','HEAD','--','audio','icon'], check=True)

          # Runtime data source is JS; JSON is not referenced by production HTML/JS/SW.
          runtime = html + js + sw
          assert 'scrapbook-data.json' not in runtime
          print('static/data-safety/repo-scope QA passed')
          PY
          git diff --check

      - name: Install browser QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Responsive, interaction, offline, and performance QA
        run: |
          set -euo pipefail
          python3 -m http.server 4193 --bind 127.0.0.1 >/tmp/fuwa-v93-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4193/index.html -o /tmp/fuwa-v93-index.html; then break; fi
            sleep .2
          done
          grep -q 'FUWA_BUILD: v93-stability-performance-qa' /tmp/fuwa-v93-index.html
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const sizes = [
            [320,700,'iPhone narrow'], [375,812,'iPhone'], [390,844,'iPhone modern'], [430,932,'iPhone large'],
            [768,1024,'iPad portrait'], [1024,768,'iPad landscape'],
            [820,1180,'iPad Air portrait'], [1180,820,'iPad Air landscape'],
            [834,1194,'iPad Pro 11 portrait'], [1194,834,'iPad Pro 11 landscape'],
            [1024,1366,'iPad Pro 12.9 portrait'], [1366,1024,'iPad Pro 12.9 landscape']
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const [width,height,label] of sizes) {
              const context = await browser.newContext({viewport:{width,height}, serviceWorkers:'allow'});
              const page = await context.newPage();
              const errors=[];
              page.on('pageerror', e => errors.push(String(e)));
              await page.addInitScript(() => {
                localStorage.setItem('fuwaLocalModeV1','1');
                localStorage.setItem('fuwaTutorialSeenV1','1');
                // Headless browsers do not need to output audio; keep media promises deterministic.
                HTMLMediaElement.prototype.play = function(){ this.paused = false; return Promise.resolve(); };
                HTMLMediaElement.prototype.pause = function(){ this.paused = true; };
              });
              const started = Date.now();
              await page.goto('http://127.0.0.1:4193/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(500);
              const readyMs = Date.now() - started;
              await page.evaluate(() => {
                document.querySelectorAll('#fuwaReleaseNotesModal,.tutorial-modal,.onboarding-modal').forEach(el=>el.classList.add('hidden'));
                document.body.style.overflow='';
              });
              assert(!errors.length, `${label}: startup page error ${errors.join(' | ')}`);
              const geom = await page.evaluate(() => ({
                sw: document.documentElement.scrollWidth,
                iw: innerWidth,
                nodes: document.getElementsByTagName('*').length,
                navBottom: document.querySelector('.bottom-nav')?.getBoundingClientRect().bottom,
                navPos: getComputedStyle(document.querySelector('.bottom-nav')).position,
              }));
              assert(geom.sw <= geom.iw + 2, `${label}: horizontal overflow ${geom.sw}/${geom.iw}`);
              assert(geom.nodes < 9000, `${label}: runaway initial DOM ${geom.nodes}`);
              assert(geom.navPos === 'fixed', `${label}: bottom nav is not fixed`);
              assert(Math.abs(geom.navBottom - height) < 4, `${label}: bottom nav not attached to viewport bottom`);
              assert(readyMs < 6000, `${label}: DOM-ready smoke exceeded 6s (${readyMs}ms)`);

              // Daily Life: actual writing page must appear without layout overflow.
              const lifeNav = page.locator('[data-nav="life"]').first();
              await lifeNav.click({force:true});
              await page.waitForTimeout(120);
              const life = await page.evaluate(() => {
                const shell=document.querySelector('.notebook-shell');
                const pageEl=document.querySelector('.journal-page.active');
                const list=document.querySelector('.journal-page-jump-list');
                return {
                  shellRight:shell?.getBoundingClientRect().right,
                  shellLeft:shell?.getBoundingClientRect().left,
                  pageTop:pageEl?.getBoundingClientRect().top,
                  listScroll:list?.scrollWidth,
                  listClient:list?.clientWidth,
                  bodyScroll:document.documentElement.scrollWidth,
                };
              });
              assert(life.shellLeft >= -1 && life.shellRight <= width + 1, `${label}: notebook exceeds viewport`);
              assert(life.pageTop !== undefined && life.pageTop < height * 1.25, `${label}: Daily Life page starts too far down`);
              assert(life.bodyScroll <= width + 2, `${label}: Daily Life causes page overflow`);

              // Sleep Corner: Now Playing remains above Soundscape and no audio is downloaded just by opening the view.
              const sleepNav = page.locator('[data-nav="sleep"]').first();
              await sleepNav.click({force:true});
              await page.waitForTimeout(100);
              const sleepOrder = await page.evaluate(() => {
                const p=document.querySelector('#sleepPlayerCard')?.getBoundingClientRect();
                const g=document.querySelector('#sleepSoundGrid')?.getBoundingClientRect();
                return {pTop:p?.top,pBottom:p?.bottom,gTop:g?.top};
              });
              assert(sleepOrder.pBottom <= sleepOrder.gTop + 2, `${label}: Now Playing is not above Soundscape`);

              // Rapid core navigation should not multiply the DOM or throw runtime errors.
              const beforeNodes = await page.evaluate(() => document.getElementsByTagName('*').length);
              const stressStart = Date.now();
              for (let i=0;i<8;i++) {
                for (const view of ['home','entries','letters','me','life','sleep']) {
                  const nav=page.locator(`[data-nav="${view}"]`).first();
                  if (await nav.count()) await nav.click({force:true});
                }
              }
              const stressMs = Date.now()-stressStart;
              const afterNodes = await page.evaluate(() => document.getElementsByTagName('*').length);
              assert(afterNodes < Math.max(9000,beforeNodes*1.45), `${label}: navigation DOM grew excessively ${beforeNodes}->${afterNodes}`);
              assert(stressMs < 10000, `${label}: navigation stress too slow ${stressMs}ms`);
              assert(!errors.length, `${label}: runtime page errors after stress ${errors.join(' | ')}`);

              // Sanctuary Surprise me: seed one transient QA memory in this isolated browser, then verify reveal.
              await page.evaluate(() => {
                if (typeof state !== 'undefined') {
                  state.tinyJoys = [{id:'qa-joy', text:'A quiet QA memory', createdAt:new Date().toISOString(), date:new Date().toISOString()}];
                  if (typeof renderCache !== 'undefined') renderCache.sanctuary='';
                  if (typeof renderSanctuary === 'function') renderSanctuary(true);
                }
              });
              const sanctuaryNav = page.locator('[data-nav="sanctuary"]').first();
              await sanctuaryNav.click({force:true});
              await page.waitForTimeout(120);
              const surprise = page.locator('#sanctuarySurpriseMemoryButton');
              assert(await surprise.count() === 1, `${label}: Surprise me button missing`);
              await surprise.click({force:true});
              await page.waitForTimeout(80);
              const cardVisible = await page.locator('#sanctuaryMemoryCard').evaluate(el => !el.classList.contains('hidden') && el.getBoundingClientRect().height > 0);
              assert(cardVisible, `${label}: Surprise me did not reveal a memory`);
              assert(!errors.length, `${label}: Sanctuary page error ${errors.join(' | ')}`);

              await context.close();
            }

            // Dedicated service-worker/offline test on a clean context.
            const context = await browser.newContext({viewport:{width:390,height:844}, serviceWorkers:'allow'});
            const page = await context.newPage();
            await page.addInitScript(() => localStorage.setItem('fuwaLocalModeV1','1'));
            await page.goto('http://127.0.0.1:4193/index.html',{waitUntil:'networkidle'});
            await page.evaluate(() => navigator.serviceWorker.ready);
            await page.waitForTimeout(300);
            const initialCache = await page.evaluate(async () => {
              const cache=await caches.open('fuwa-shell-v93');
              return (await cache.keys()).map(r=>r.url);
            });
            assert(initialCache.some(x=>x.endsWith('/index.html')), 'SW core shell did not cache index');
            assert(!initialCache.some(x=>x.includes('/audio/sleep/')), 'SW eagerly cached Sleep audio during install');

            // First use caches only the requested ambience file.
            const audioUrl='http://127.0.0.1:4193/audio/sleep/gentle-rain.mp3';
            const response=await page.evaluate(url=>fetch(url).then(r=>({ok:r.ok,status:r.status})),audioUrl);
            assert(response.ok, `first audio fetch failed ${response.status}`);
            await page.waitForTimeout(100);
            const cachedAudio=await page.evaluate(async url=>!!(await (await caches.open('fuwa-shell-v93')).match(url)),audioUrl);
            assert(cachedAudio,'requested Sleep audio was not cached lazily');

            await context.setOffline(true);
            await page.reload({waitUntil:'domcontentloaded'});
            const offlineTitle=await page.title();
            assert(offlineTitle.includes('Fuwa'),'offline core shell reload failed');
            const offlineAudio=await page.evaluate(url=>fetch(url).then(r=>r.ok).catch(()=>false),audioUrl);
            assert(offlineAudio,'previously used Sleep audio unavailable offline');
            await context.close();
            await browser.close();
            console.log('responsive/interaction/performance/offline QA passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Build clean packages
        run: |
          set -euo pipefail
          mkdir -p dist/ready dist/full/Fuwa
          cp index.html app.js manifest.json service-worker.js dist/ready/
          cat > dist/ready/INSTALL.txt <<'TXT'
          FUWA 1.1.8 / v93 — READY TO COPY

          Replace these four files in Fuwa's MAIN/ROOT folder:
          - index.html
          - app.js
          - manifest.json
          - service-worker.js

          Keep style.css, firebase-fuwa.js, audio/, data/, and icon/ exactly where they are.
          No database reset or data deletion is required.
          TXT
          cp index.html style.css app.js manifest.json service-worker.js firebase-fuwa.js dist/full/Fuwa/
          cp -R audio data icon dist/full/Fuwa/
          cat > dist/full/Fuwa/README-RELEASE.txt <<'TXT'
          FUWA 1.1.8 / v93 — FULL CLEAN PRODUCTION TREE
          This folder contains the complete production file layout only.
          QA helpers, workflows, Git metadata, and temporary files are intentionally excluded.
          TXT
          find dist -type d -name '.github' -o -name 'tools' | grep . && exit 1 || true
          find dist/full/Fuwa -maxdepth 3 -type f | sort

      - name: Upload ready-to-copy changes
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v93-ready-to-copy
          path: dist/ready
          retention-days: 1

      - name: Upload full clean release tree
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v93-full-clean-release
          path: dist/full/Fuwa
          retention-days: 1
