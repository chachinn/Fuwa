name: Fuwa v91 HQ Sleep package QA

on:
  push:
    branches:
      - qa/v91-hq-sleep-audio-package

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v91-hq-sleep-audio-package
          fetch-depth: 0

      - name: Apply Fuwa v91 production patch
        run: python3 tools/fuwa_v91_hq_sleep_patch.py

      - name: Prepare audio tools
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          mkdir -p /tmp/fuwa-audio-src audio/sleep

      - name: Download public-domain and CC0 source recordings
        run: |
          set -euo pipefail
          UA='Fuwa-PWA/1.1.6 sleep-audio-build'
          curl -L --fail --retry 4 --retry-all-errors -A "$UA" 'https://upload.wikimedia.org/wikipedia/commons/0/0e/Rain_%281%29.ogg' -o /tmp/fuwa-audio-src/rain.ogg
          curl -L --fail --retry 4 --retry-all-errors -A "$UA" 'https://upload.wikimedia.org/wikipedia/commons/1/1f/Waves.ogg' -o /tmp/fuwa-audio-src/waves.ogg
          curl -L --fail --retry 4 --retry-all-errors -A "$UA" 'https://upload.wikimedia.org/wikipedia/commons/8/80/Bones_breaking_wood_fire_ice_crackling.ogg' -o /tmp/fuwa-audio-src/fire.ogg
          curl -L --fail --retry 4 --retry-all-errors -A "$UA" 'https://upload.wikimedia.org/wikipedia/commons/2/2d/Howling_wind.ogg' -o /tmp/fuwa-audio-src/wind.ogg
          curl -L --fail --retry 4 --retry-all-errors -A "$UA" 'https://upload.wikimedia.org/wikipedia/commons/0/0a/20090610_0_ambience.ogg' -o /tmp/fuwa-audio-src/forest.ogg
          curl -L --fail --retry 4 --retry-all-errors -A "$UA" 'https://upload.wikimedia.org/wikipedia/commons/5/54/Cafe_ambiance.ogg' -o /tmp/fuwa-audio-src/cafe.ogg
          for f in /tmp/fuwa-audio-src/*.ogg; do test -s "$f"; ffprobe -v error "$f" >/dev/null; done

      - name: Master high-quality local Sleep Corner audio
        run: |
          set -euo pipefail
          COMMON='loudnorm=I=-21:TP=-2:LRA=11'

          ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i /tmp/fuwa-audio-src/rain.ogg -t 150 \
            -af "highpass=f=70,lowpass=f=11000,${COMMON}" -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k \
            -map_metadata -1 -metadata title='Gentle Rain' audio/sleep/gentle-rain.mp3

          ffmpeg -hide_banner -loglevel error -y -ss 20 -i /tmp/fuwa-audio-src/waves.ogg -t 150 \
            -af "highpass=f=40,lowpass=f=12000,${COMMON}" -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k \
            -map_metadata -1 -metadata title='Ocean Drift' audio/sleep/ocean-drift.mp3

          ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i /tmp/fuwa-audio-src/fire.ogg -t 150 \
            -af "highpass=f=70,lowpass=f=7500,equalizer=f=3500:t=q:w=1:g=-5,loudnorm=I=-22:TP=-2:LRA=10" \
            -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k -map_metadata -1 -metadata title='Warm Hearth' audio/sleep/warm-hearth.mp3

          ffmpeg -hide_banner -loglevel error -y -ss 4 -i /tmp/fuwa-audio-src/wind.ogg -t 120 \
            -af "highpass=f=55,lowpass=f=6500,equalizer=f=2000:t=q:w=1:g=-3,loudnorm=I=-22:TP=-2:LRA=10" \
            -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k -map_metadata -1 -metadata title='Evening Breeze' audio/sleep/evening-breeze.mp3

          ffmpeg -hide_banner -loglevel error -y -ss 2 -i /tmp/fuwa-audio-src/forest.ogg -t 120 \
            -af "highpass=f=90,lowpass=f=9000,loudnorm=I=-23:TP=-2:LRA=12" \
            -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k -map_metadata -1 -metadata title='Quiet Forest' audio/sleep/quiet-forest.mp3

          ffmpeg -hide_banner -loglevel error -y -ss 60 -i /tmp/fuwa-audio-src/cafe.ogg -t 150 \
            -af "highpass=f=80,lowpass=f=5200,equalizer=f=2400:t=q:w=1:g=-2,loudnorm=I=-24:TP=-2:LRA=10" \
            -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k -map_metadata -1 -metadata title='Cozy Room' audio/sleep/cozy-room.mp3

          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'anoisesrc=color=brown:amplitude=0.22:sample_rate=48000:duration=150' \
            -af 'highpass=f=30,lowpass=f=1100,loudnorm=I=-24:TP=-3:LRA=7' \
            -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k -map_metadata -1 -metadata title='Deep Hush' audio/sleep/deep-hush.mp3

          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'anoisesrc=color=pink:amplitude=0.18:sample_rate=48000:duration=150' \
            -af 'highpass=f=80,lowpass=f=4200,equalizer=f=2500:t=q:w=1:g=-3,loudnorm=I=-25:TP=-3:LRA=7' \
            -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k -map_metadata -1 -metadata title='Soft Air' audio/sleep/soft-air.mp3

      - name: Add source and license notes
        run: |
          cat > audio/sleep/README-LICENSES.txt <<'TXT'
          Fuwa Sleep Corner — local audio source notes
          Build: v91 / Fuwa 1.1.6

          Natural ambience recordings are sourced from Wikimedia Commons and mastered locally for Fuwa.
          Fuwa changes include trimming/loop preparation, filtering, loudness balancing, resampling, and MP3 encoding.

          Gentle Rain
          Source: Rain (1).ogg — ezwa / PDSounds
          License: Public Domain
          https://commons.wikimedia.org/wiki/File:Rain_(1).ogg

          Ocean Drift
          Source: Waves.ogg — Dsw4
          License: Public Domain
          https://commons.wikimedia.org/wiki/File:Waves.ogg

          Warm Hearth
          Source: Bones breaking wood fire ice crackling.ogg — stephan / PDSounds
          License: Public Domain
          https://commons.wikimedia.org/wiki/File:Bones_breaking_wood_fire_ice_crackling.ogg

          Evening Breeze
          Source: Howling wind.ogg — Tvabutzku1234
          License: CC0 1.0 Universal / Public Domain Dedication
          https://commons.wikimedia.org/wiki/File:Howling_wind.ogg

          Quiet Forest
          Source: 20090610 0 ambience.ogg — nille / PDSounds
          License: Public Domain
          https://commons.wikimedia.org/wiki/File:20090610_0_ambience.ogg

          Cozy Room
          Source: Cafe ambiance.ogg — Marble Toast
          License: CC0 1.0 Universal / Public Domain Dedication
          https://commons.wikimedia.org/wiki/File:Cafe_ambiance.ogg

          Deep Hush and Soft Air
          Generated specifically for Fuwa during the release build with FFmpeg noise sources, then filtered and mastered offline. No third-party audio asset is embedded for these two tracks.
          TXT

      - name: Audio integrity and mastering QA
        run: |
          set -euo pipefail
          expected=(gentle-rain ocean-drift warm-hearth evening-breeze quiet-forest cozy-room deep-hush soft-air)
          for name in "${expected[@]}"; do
            f="audio/sleep/${name}.mp3"
            test -s "$f"
            codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f")
            rate=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 "$f")
            channels=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$f")
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")
            echo "$name codec=$codec rate=$rate channels=$channels duration=$duration"
            test "$codec" = mp3
            test "$rate" = 48000
            test "$channels" = 2
            awk -v d="$duration" 'BEGIN{exit !(d >= 115)}'
            ffmpeg -v error -i "$f" -f null -
          done
          test -s audio/sleep/README-LICENSES.txt
          du -sh audio/sleep

      - name: Static, release and data-safety QA
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-fuwa.js
          node --check data/scrapbook-data.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest valid')"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          old_js=subprocess.check_output(['git','show','HEAD:app.js'],text=True)
          assert 'FUWA_BUILD: v91-hq-recorded-sleep-audio-qa' in html
          assert 'What’s new in Fuwa 1.1.6' in html
          assert 'fuwa-shell-v91' in sw
          assert 'fuwa-v1.1.6-2026-08-14' in sw and 'fuwa-v1.1.6-2026-08-14' in js
          assert re.search(r'const DATABASE_VERSION = 13;', js)
          for token in ('localStorage.clear(', 'indexedDB.deleteDatabase('):
              assert js.count(token) <= old_js.count(token), token
          for untouched in ('firebase-fuwa.js','manifest.json','style.css'):
              subprocess.run(['git','diff','--exit-code','HEAD','--',untouched],check=True)
          subprocess.run(['git','diff','--exit-code','HEAD','--','data','icon'],check=True)
          player=html.index('id="sleepPlayerCard"')
          soundscape=html.index('<p class="eyebrow">Choose your sound</p>')
          timer=html.index('<p class="eyebrow">How long?</p>')
          assert player < soundscape < timer
          for path in ('gentle-rain.mp3','ocean-drift.mp3','warm-hearth.mp3','evening-breeze.mp3','quiet-forest.mp3','cozy-room.mp3','deep-hush.mp3','soft-air.mp3'):
              assert path in js and path in sw
          for old in ('AudioContext','sleepAudioContext','sleepMasterGain','buildRainSound','stopSleepNodesOnly'):
              assert old not in js, old
          assert 'new Audio()' in js and 'preload = "metadata"' in js
          print('static/data-safety QA passed')
          PY
          git diff --check

      - name: Install responsive browser QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Phone and iPad browser interaction QA
        run: |
          python3 -m http.server 4173 >/tmp/fuwa-v91-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/fuwa-v91-smoke.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const sizes=[
            {name:'iPhone small',width:320,height:568},
            {name:'iPhone standard',width:390,height:844,audio:true},
            {name:'iPhone large',width:430,height:932},
            {name:'iPad portrait',width:820,height:1180},
            {name:'iPad landscape',width:1180,height:820}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const spec of sizes){
              const context=await browser.newContext({viewport:{width:spec.width,height:spec.height},isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.addInitScript(()=>{
                localStorage.setItem('fuwaLocalModeV1','1');
                localStorage.setItem('fuwaTutorialSeenV1','1');
              });
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(800);
              await page.evaluate(()=>{
                ['fuwaTutorial','moodCheckinModal','fuwaReleaseNotesModal'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));
                document.body.style.overflow='';
                navigate('sleep');
              });
              await page.waitForTimeout(250);
              const layout=await page.evaluate(()=>{
                const player=document.querySelector('#sleepPlayerCard');
                const soundHeading=[...document.querySelectorAll('#sleepView .sleep-section')].find(x=>x.textContent.includes('Soundscape'));
                const timer=[...document.querySelectorAll('#sleepView .sleep-section')].find(x=>x.textContent.includes('Sleep timer'));
                const nav=document.querySelector('.bottom-nav')?.getBoundingClientRect();
                return {
                  overflow:document.documentElement.scrollWidth-window.innerWidth,
                  playerTop:player?.getBoundingClientRect().top,
                  soundTop:soundHeading?.getBoundingClientRect().top,
                  timerTop:timer?.getBoundingClientRect().top,
                  navBottom:nav?window.innerHeight-nav.bottom:999,
                  sounds:document.querySelectorAll('[data-sleep-sound]').length,
                  canMp3:document.createElement('audio').canPlayType('audio/mpeg')
                };
              });
              if(layout.overflow>2) throw new Error(`${spec.name} overflow ${layout.overflow}`);
              if(!(layout.playerTop < layout.soundTop && layout.soundTop < layout.timerTop)) throw new Error(`${spec.name} Sleep Corner order wrong ${JSON.stringify(layout)}`);
              if(Math.abs(layout.navBottom)>2) throw new Error(`${spec.name} nav not bottom attached ${layout.navBottom}`);
              if(layout.sounds!==8) throw new Error(`${spec.name} expected 8 sounds`);
              if(!layout.canMp3) throw new Error(`${spec.name} browser reports no MP3 support`);

              if(spec.audio){
                await page.locator('[data-sleep-sound="rain"]').click({force:true});
                await page.locator('#sleepPlayPauseButton').click({force:true});
                await page.waitForTimeout(900);
                let state=await page.evaluate(()=>({playing:sleepIsPlaying,paused:sleepAudioElement?.paused,src:sleepAudioElement?.currentSrc||'',text:document.querySelector('#sleepPlayPauseText')?.textContent}));
                if(!state.playing || state.paused || !state.src.includes('gentle-rain.mp3') || state.text!=='Pause') throw new Error(`play failed ${JSON.stringify(state)}`);
                await page.locator('[data-sleep-sound="waves"]').click({force:true});
                await page.locator('[data-sleep-sound="forest"]').click({force:true});
                await page.locator('[data-sleep-sound="cafe"]').click({force:true});
                await page.waitForTimeout(900);
                state=await page.evaluate(()=>({sound:state.sleepSound,src:sleepAudioElement?.currentSrc||'',label:document.querySelector('#sleepNowPlaying')?.textContent,playing:sleepIsPlaying}));
                if(state.sound!=='cafe' || !state.src.includes('cozy-room.mp3') || state.label!=='Cozy Room' || !state.playing) throw new Error(`rapid switch failed ${JSON.stringify(state)}`);
                await page.locator('#sleepPlayPauseButton').click({force:true});
                await page.waitForTimeout(100);
                state=await page.evaluate(()=>({playing:sleepIsPlaying,paused:sleepIsPaused,audioPaused:sleepAudioElement?.paused}));
                if(state.playing || !state.paused || !state.audioPaused) throw new Error(`pause failed ${JSON.stringify(state)}`);
                await page.locator('#sleepPlayPauseButton').click({force:true});
                await page.waitForTimeout(300);
                await page.locator('#sleepStopButton').click({force:true});
                state=await page.evaluate(()=>({playing:sleepIsPlaying,paused:sleepIsPaused,audioPaused:sleepAudioElement?.paused,remaining:sleepRemainingMs}));
                if(state.playing || state.paused || !state.audioPaused || state.remaining!==0) throw new Error(`stop failed ${JSON.stringify(state)}`);
                await page.screenshot({path:'/tmp/fuwa-v91-sleep.png',fullPage:true});
              }
              if(errors.length) throw new Error(`${spec.name} page errors ${errors.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            console.log('responsive/audio interaction QA passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/fuwa-v91-smoke.cjs

      - name: Prepare ready-to-copy package
        run: |
          mkdir -p dist/Fuwa-v91-HQ-Sleep/audio
          cp index.html app.js service-worker.js dist/Fuwa-v91-HQ-Sleep/
          cp -R audio/sleep dist/Fuwa-v91-HQ-Sleep/audio/
          cat > dist/Fuwa-v91-HQ-Sleep/INSTALL.txt <<'TXT'
          FUWA v91 HQ SLEEP — READY TO COPY

          Replace these files in the Fuwa main folder:
          - index.html
          - app.js
          - service-worker.js

          Then copy the included audio folder into the Fuwa main folder so the final paths are:
          audio/sleep/gentle-rain.mp3
          audio/sleep/ocean-drift.mp3
          audio/sleep/warm-hearth.mp3
          audio/sleep/evening-breeze.mp3
          audio/sleep/quiet-forest.mp3
          audio/sleep/cozy-room.mp3
          audio/sleep/deep-hush.mp3
          audio/sleep/soft-air.mp3
          audio/sleep/README-LICENSES.txt

          Do not delete any other Fuwa files or data folders.
          TXT

      - name: Upload Fuwa v91 ready-to-copy files
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v91-HQ-Sleep-ready-to-copy
          path: dist/Fuwa-v91-HQ-Sleep
          retention-days: 1
          compression-level: 6

      - name: Upload QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v91-HQ-Sleep-QA-screenshot
          path: /tmp/fuwa-v91-sleep.png
          retention-days: 1
