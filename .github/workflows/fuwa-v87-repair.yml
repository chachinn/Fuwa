name: Fuwa v87 local-mode repair
on:
  push:
    branches: [qa/v87-ui-responsive-stability]
    paths: [.fuwa-v87-repair-run]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v87-ui-responsive-stability
      - run: python3 tools/fuwa_v87_localmode_repair.py
      - run: node --check firebase-fuwa.js
      - run: |
          git config user.name "Fuwa QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add firebase-fuwa.js
          git diff --cached --check
          git commit -m "Fix local-mode auto-sync runtime error"
          git push origin HEAD:qa/v87-ui-responsive-stability
