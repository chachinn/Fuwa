name: Fuwa v87 full QA

on:
  push:
    branches: [qa/v87-ui-responsive-stability]
    paths: [.fuwa-v87-qa-run]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v87-ui-responsive-stability
          fetch-depth: 0

      - name: JavaScript and manifest checks
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-fuwa.js
          node --check data/scrapbook-data.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest valid')"

      - name: Regression, data-safety and DOM checks
        run: |
          git fetch origin main
          python3 - <<'PY'
          import re, subprocess
          from collections import Counter
          from pathlib import Path

          def cur(path): return Path(path).read_text(encoding='utf-8')
          def old(path): return subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)
          js, html, css, sw = cur('app.js'), cur('index.html'), cur('style.css'), cur('service-worker.js')
          old_js, old_html = old('app.js'), old('index.html')

          def funcs(s): return Counter(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', s))
          base_f, now_f = funcs(old_js), funcs(js)
          new_dups = {k:v for k,v in now_f.items() if v > 1 and v > base_f.get(k,0)}
          assert not new_dups, f'new duplicate functions: {new_dups}'

          def ids(s): return Counter(re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']', s))
          base_i, now_i = ids(old_html), ids(html)
          new_id_dups = {k:v for k,v in now_i.items() if v > 1 and v > base_i.get(k,0)}
          assert not new_id_dups, f'new duplicate HTML ids: {new_id_dups}'

          def refs(s):
              out=set(re.findall(r'\bgetElementById\(\s*["\']([^"\']+)["\']\s*\)',s))
              out|=set(re.findall(r'(?<![\w$])\$\(\s*["\']([^"\']+)["\']\s*\)',s))
              return out
          base_missing=refs(old_js)-set(base_i)
          now_missing=refs(js)-set(now_i)
          assert not (now_missing-base_missing), f'new missing DOM bindings: {sorted(now_missing-base_missing)}'

          old_db=re.search(r'const DATABASE_VERSION = (\d+);',old_js).group(1)
          new_db=re.search(r'const DATABASE_VERSION = (\d+);',js).group(1)
          assert old_db == new_db == '13', f'database version changed: {old_db} -> {new_db}'
          for token in ('localStorage.clear(', 'indexedDB.deleteDatabase('):
              assert js.count(token) <= old_js.count(token), f'new destructive call: {token}'

          assert 'FUWA_BUILD: v87-ui-responsive-stability-qa' in html
          assert 'fuwa-shell-v87' in sw
          assert 'fuwa-v1.1.2-2026-08-14' in sw and 'fuwa-v1.1.2-2026-08-14' in js
          assert 'FUWA V87 — RESPONSIVE UI + TYPOGRAPHY STABILITY' in css
          assert 'FUWA V87 — SLEEP PLAYER INTEGRATION' in js
          assert '-webkit-text-size-adjust:100%' in css
          assert '.journal-palette-empty' in css and 'grid-column:1/-1' in css
          assert '.weather-legend span' in css and 'font-size:13px' in css
          assert '.journal-section-tabs' in css and 'grid-template-columns:repeat(2,minmax(0,1fr))' in css

          subprocess.run(['git','diff','--exit-code','origin/main','--','firebase-fuwa.js','manifest.json','data','icon'],check=True)
          print('static regression/data-safety QA passed')
          PY
          git diff --check origin/main -- index.html style.css app.js service-worker.js

      - name: Install Chromium smoke-test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Responsive browser smoke tests
        run: |
          python3 -m http.server 4173 >/tmp/fuwa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/fuwa-smoke.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const sizes=[{width:320,height:568},{width:375,height:812},{width:390,height:844},{width:430,height:932}];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of sizes){
              const context=await browser.newContext({viewport,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.addInitScript(()=>localStorage.setItem('fuwaLocalModeV1','1'));
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1200);

              const base=await page.evaluate(()=>({
                sw:document.documentElement.scrollWidth-window.innerWidth,
                shell:document.querySelector('.app-shell')?.getBoundingClientRect().width||0,
                nav:document.querySelector('.bottom-nav')?.getBoundingClientRect().width||0,
                vw:window.innerWidth,
                integrated:document.getElementById('sleepPlayerCard')?.parentElement===document.getElementById('sleepSoundGrid')?.closest('.sleep-section')
              }));
              if(base.sw>2||base.shell>base.vw+1||base.nav>base.vw+1)throw new Error(`base overflow ${viewport.width}: ${JSON.stringify(base)}`);
              if(!base.integrated)throw new Error('Sleep player is not integrated with Soundscape');

              await page.evaluate(()=>document.querySelector('[data-nav="life"]')?.click());
              await page.waitForTimeout(250);
              const life=await page.evaluate(()=>{
                const tabs=document.querySelector('.journal-section-tabs');
                const shell=document.querySelector('.notebook-shell');
                return {overflow:tabs?tabs.scrollWidth-tabs.clientWidth:999,right:shell?.getBoundingClientRect().right||9999,vw:window.innerWidth};
              });
              if(life.overflow>3||life.right>life.vw+2)throw new Error(`Daily Life layout ${viewport.width}: ${JSON.stringify(life)}`);

              await page.evaluate(()=>document.querySelector('[data-nav="weather"]')?.click());
              await page.waitForTimeout(250);
              const weather=await page.evaluate(()=>[...document.querySelectorAll('.weather-legend > span')].map(el=>({t:el.textContent.trim(),s:parseFloat(getComputedStyle(el).fontSize)})));
              if(weather.length&&weather.some(x=>!/\d/.test(x.t)||x.s<12))throw new Error(`weather count visibility ${viewport.width}: ${JSON.stringify(weather)}`);

              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>2)throw new Error(`navigation overflow ${viewport.width}: ${overflow}`);
              if(pageErrors.length)throw new Error(`page errors ${viewport.width}: ${pageErrors.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            console.log('browser QA passed at 320/375/390/430px');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/fuwa-smoke.cjs
