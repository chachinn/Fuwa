name: Fuwa v88 iPad responsive QA

on:
  push:
    branches: [qa/v88-ipad-responsive]
    paths: [.fuwa-v88-run]

permissions:
  contents: write

jobs:
  ipad-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v88-ipad-responsive
          fetch-depth: 0

      - name: Apply iPad responsive patch
        run: python3 tools/fuwa_v88_ipad_patch.py

      - name: Syntax, release and data-safety checks
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-fuwa.js
          node --check data/scrapbook-data.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest valid')"
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          old_js=subprocess.check_output(['git','show','origin/main:app.js'],text=True)
          assert 'FUWA_BUILD: v88-ipad-responsive-qa' in html
          assert 'What’s new in Fuwa 1.1.3' in html
          assert 'fuwa-shell-v88' in sw
          assert 'fuwa-v1.1.3-2026-08-14' in sw and 'fuwa-v1.1.3-2026-08-14' in js
          assert 'FUWA V88 — IPAD PORTRAIT + LANDSCAPE RESPONSIVE TIER' in css
          assert '@media (min-width:700px)' in css
          assert '@media (min-width:1000px) and (orientation:landscape)' in css
          old_db=re.search(r'const DATABASE_VERSION = (\d+);',old_js).group(1)
          new_db=re.search(r'const DATABASE_VERSION = (\d+);',js).group(1)
          assert old_db == new_db == '13'
          for token in ('localStorage.clear(', 'indexedDB.deleteDatabase('):
              assert js.count(token) <= old_js.count(token), f'new destructive call: {token}'
          subprocess.run(['git','diff','--exit-code','origin/main','--','firebase-fuwa.js','manifest.json','data','icon'],check=True)
          print('static iPad/data-safety QA passed')
          PY
          git diff --check origin/main -- index.html style.css app.js service-worker.js

      - name: Install browser QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Phone + iPad portrait and landscape browser QA
        run: |
          python3 -m http.server 4173 >/tmp/fuwa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/fuwa-ipad-smoke.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const sizes=[
            {name:'iPhone small',width:320,height:568,tablet:false},
            {name:'iPhone standard',width:390,height:844,tablet:false},
            {name:'iPhone large',width:430,height:932,tablet:false},
            {name:'iPad 10.2 portrait',width:768,height:1024,tablet:true,orientation:'portrait'},
            {name:'iPad 10.2 landscape',width:1024,height:768,tablet:true,orientation:'landscape'},
            {name:'iPad Air portrait',width:820,height:1180,tablet:true,orientation:'portrait'},
            {name:'iPad Air landscape',width:1180,height:820,tablet:true,orientation:'landscape'},
            {name:'iPad Pro 11 portrait',width:834,height:1194,tablet:true,orientation:'portrait'},
            {name:'iPad Pro 11 landscape',width:1194,height:834,tablet:true,orientation:'landscape'},
            {name:'iPad Pro 12.9 portrait',width:1024,height:1366,tablet:true,orientation:'portrait'},
            {name:'iPad Pro 12.9 landscape',width:1366,height:1024,tablet:true,orientation:'landscape'}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const spec of sizes){
              const context=await browser.newContext({viewport:{width:spec.width,height:spec.height},isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.addInitScript(()=>localStorage.setItem('fuwaLocalModeV1','1'));
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1000);

              const base=await page.evaluate(()=>({
                vw:window.innerWidth,
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                shell:document.querySelector('.app-shell')?.getBoundingClientRect().width||0,
                nav:document.querySelector('.bottom-nav')?.getBoundingClientRect().width||0
              }));
              if(base.overflow>2||base.shell>base.vw+1||base.nav>base.vw+1) throw new Error(`${spec.name} base overflow ${JSON.stringify(base)}`);
              if(spec.tablet && base.shell<700) throw new Error(`${spec.name} still using phone-width shell: ${base.shell}`);

              await page.evaluate(()=>document.querySelector('[data-nav="life"]')?.click());
              await page.waitForTimeout(220);
              const life=await page.evaluate(()=>{
                const tabs=document.querySelector('.journal-section-tabs');
                const shell=document.querySelector('.notebook-shell');
                const cols=tabs?getComputedStyle(tabs).gridTemplateColumns.split(' ').filter(Boolean).length:0;
                return {cols,overflow:tabs?tabs.scrollWidth-tabs.clientWidth:999,right:shell?.getBoundingClientRect().right||9999,vw:window.innerWidth};
              });
              if(life.overflow>3||life.right>life.vw+2) throw new Error(`${spec.name} Daily Life overflow ${JSON.stringify(life)}`);
              if(spec.tablet && life.cols!==4) throw new Error(`${spec.name} expected 4 Daily Life section columns, got ${life.cols}`);

              await page.evaluate(()=>document.querySelector('[data-nav="weather"]')?.click());
              await page.waitForTimeout(220);
              const weatherCols=await page.evaluate(()=>{
                const el=document.querySelector('.weather-legend');
                return el?getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length:0;
              });
              if(spec.tablet && weatherCols!==6) throw new Error(`${spec.name} expected 6 weather columns, got ${weatherCols}`);

              if(spec.tablet && spec.orientation==='landscape'){
                await page.evaluate(()=>document.querySelector('[data-nav="scrapbook"]')?.click());
                await page.waitForTimeout(220);
                const scrapbookCols=await page.evaluate(()=>{
                  const el=document.querySelector('.scrapbook-library-grid');
                  return el?getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length:0;
                });
                if(scrapbookCols && scrapbookCols!==4) throw new Error(`${spec.name} expected 4 scrapbook columns, got ${scrapbookCols}`);
              }

              const finalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(finalOverflow>2) throw new Error(`${spec.name} navigation overflow ${finalOverflow}`);
              if(errors.length) throw new Error(`${spec.name} page errors: ${errors.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            console.log('phone + iPad portrait/landscape browser QA passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/fuwa-ipad-smoke.cjs

      - name: Commit clean production patch
        run: |
          git config user.name "Fuwa QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm tools/fuwa_v88_ipad_patch.py .github/workflows/fuwa-v88-ipad.yml .fuwa-v88-run
          git add index.html style.css app.js service-worker.js
          git commit -m "Fuwa v88: add iPad portrait and landscape layouts"
          git push origin HEAD:qa/v88-ipad-responsive
