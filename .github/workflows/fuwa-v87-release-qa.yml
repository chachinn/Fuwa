name: Fuwa v87 release QA

on:
  push:
    branches: [qa/v87-ui-responsive-stability]
    paths: [.fuwa-v87-release-qa-run]

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v87-ui-responsive-stability
          fetch-depth: 0

      - name: Syntax and manifest validity
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-fuwa.js
          node --check data/scrapbook-data.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest valid')"

      - name: Data safety, DOM and regression checks
        run: |
          git fetch origin main
          python3 - <<'PY'
          import re, subprocess
          from collections import Counter
          from pathlib import Path

          def cur(path): return Path(path).read_text(encoding='utf-8')
          def old(path): return subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)
          js, html, css, sw, fb = [cur(p) for p in ('app.js','index.html','style.css','service-worker.js','firebase-fuwa.js')]
          old_js, old_html, old_fb = [old(p) for p in ('app.js','index.html','firebase-fuwa.js')]

          def funcs(s): return Counter(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',s))
          for label, before, after in [('app.js',old_js,js),('firebase-fuwa.js',old_fb,fb)]:
              b,n=funcs(before),funcs(after)
              regressions={k:v for k,v in n.items() if v>1 and v>b.get(k,0)}
              assert not regressions, f'new duplicate functions in {label}: {regressions}'

          def ids(s): return Counter(re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',s))
          b_ids,n_ids=ids(old_html),ids(html)
          id_reg={k:v for k,v in n_ids.items() if v>1 and v>b_ids.get(k,0)}
          assert not id_reg, f'new duplicate HTML ids: {id_reg}'

          def refs(s):
              out=set(re.findall(r'\bgetElementById\(\s*["\']([^"\']+)["\']\s*\)',s))
              out|=set(re.findall(r'(?<![\w$])\$\(\s*["\']([^"\']+)["\']\s*\)',s))
              return out
          base_missing=refs(old_js)-set(b_ids)
          now_missing=refs(js)-set(n_ids)
          assert not (now_missing-base_missing), f'new missing DOM bindings: {sorted(now_missing-base_missing)}'

          old_db=re.search(r'const DATABASE_VERSION = (\d+);',old_js).group(1)
          new_db=re.search(r'const DATABASE_VERSION = (\d+);',js).group(1)
          assert old_db==new_db=='13', f'IndexedDB version changed unexpectedly: {old_db}->{new_db}'

          for token in ('localStorage.clear(', 'indexedDB.deleteDatabase('):
              assert js.count(token)<=old_js.count(token), f'new destructive app call: {token}'
              assert fb.count(token)<=old_fb.count(token), f'new destructive firebase call: {token}'

          assert 'FUWA_BUILD: v87-ui-responsive-stability-qa' in html
          assert 'fuwa-shell-v87' in sw
          assert 'fuwa-v1.1.2-2026-08-14' in sw and 'fuwa-v1.1.2-2026-08-14' in js
          assert 'FUWA V87 — RESPONSIVE UI + TYPOGRAPHY STABILITY' in css
          assert 'FUWA V87 — SLEEP PLAYER INTEGRATION' in js
          assert 'FUWA V87 — LOCAL MODE AUTO-SYNC SAFETY' in fb
          assert 'function stopAutoSync()' in fb
          assert 'if (isLocalModeChosen() || !auth?.currentUser?.uid) return;' in fb
          assert '-webkit-text-size-adjust:100%' in css
          assert '.journal-palette-empty' in css and 'grid-column:1/-1' in css
          assert '.weather-legend span' in css and 'font-size:13px' in css
          assert '.journal-section-tabs' in css and 'grid-template-columns:repeat(2,minmax(0,1fr))' in css

          subprocess.run(['git','diff','--exit-code','origin/main','--','manifest.json','data','icon'],check=True)
          print('data safety / DOM / regression QA passed')
          PY
          git diff --check origin/main -- index.html style.css app.js service-worker.js firebase-fuwa.js

      - name: Install Chromium runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Responsive browser QA
        run: |
          python3 -m http.server 4173 >/tmp/fuwa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/fuwa-v87-smoke.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const sizes=[{width:320,height:568},{width:375,height:812},{width:390,height:844},{width:430,height:932}];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of sizes){
              const context=await browser.newContext({viewport,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.addInitScript(()=>localStorage.setItem('fuwaLocalModeV1','1'));
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1200);

              const base=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                shell:document.querySelector('.app-shell')?.getBoundingClientRect().width||0,
                nav:document.querySelector('.bottom-nav')?.getBoundingClientRect().width||0,
                vw:window.innerWidth,
                local:document.body.classList.contains('auth-local'),
                integrated:document.getElementById('sleepPlayerCard')?.parentElement===document.getElementById('sleepSoundGrid')?.closest('.sleep-section')
              }));
              if(!base.local)throw new Error(`local mode did not enter at ${viewport.width}px`);
              if(base.overflow>2||base.shell>base.vw+1||base.nav>base.vw+1)throw new Error(`base overflow ${viewport.width}: ${JSON.stringify(base)}`);
              if(!base.integrated)throw new Error('Sleep player is not integrated into Soundscape');

              await page.evaluate(()=>document.querySelector('[data-nav="life"]')?.click());
              await page.waitForTimeout(250);
              const life=await page.evaluate(()=>{
                const tabs=document.querySelector('.journal-section-tabs');
                const shell=document.querySelector('.notebook-shell');
                return {tabs:!!tabs,overflow:tabs?tabs.scrollWidth-tabs.clientWidth:999,right:shell?.getBoundingClientRect().right||9999,vw:window.innerWidth};
              });
              if(!life.tabs||life.overflow>3||life.right>life.vw+2)throw new Error(`Daily Life layout ${viewport.width}: ${JSON.stringify(life)}`);

              await page.evaluate(()=>document.querySelector('[data-nav="weather"]')?.click());
              await page.waitForTimeout(250);
              const weather=await page.evaluate(()=>[...document.querySelectorAll('.weather-legend > span')].map(el=>({text:el.textContent.trim(),size:parseFloat(getComputedStyle(el).fontSize)})));
              if(weather.length!==6||weather.some(x=>!/\d/.test(x.text)||x.size<12))throw new Error(`weather legend ${viewport.width}: ${JSON.stringify(weather)}`);

              const finalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(finalOverflow>2)throw new Error(`navigation overflow ${viewport.width}: ${finalOverflow}`);
              if(errors.length)throw new Error(`runtime errors ${viewport.width}: ${errors.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            console.log('responsive browser QA passed at 320/375/390/430px');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/fuwa-v87-smoke.cjs
