name: Fuwa v94 cloud restore release QA

on:
  push:
    branches:
      - qa/v94-cloud-restore-fix

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v94-cloud-restore-fix
          fetch-depth: 0

      - name: Apply production patch
        run: python3 tools/fuwa_v94_restore_patch.py

      - name: Static syntax, data-safety, and restore-source QA
        run: |
          set -euo pipefail
          node --check app.js
          node --check firebase-fuwa.js
          node --check service-worker.js
          node --check data/scrapbook-data.js
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, collections

          app = Path('app.js').read_text(encoding='utf-8')
          fb = Path('firebase-fuwa.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          old_app = subprocess.check_output(['git','show','HEAD:app.js'], text=True)
          old_html = subprocess.check_output(['git','show','HEAD:index.html'], text=True)

          assert 'const DATABASE_VERSION = 13;' in app
          assert 'fuwa-v1.1.9-2026-08-14' in app
          assert 'FUWA_BUILD: v94-cloud-restore-safety-qa' in html
          assert 'What’s new in Fuwa 1.1.9' in html
          assert 'fuwa-shell-v94' in sw and 'fuwa-v1.1.9-2026-08-14' in sw

          # The restore counter now delegates to the canonical cloud counter.
          restored = re.search(r'function restoredRecordCount\(data\) \{([\s\S]*?)\n\}', app)
          assert restored and 'return cloudBackupRecordCount(data);' in restored.group(1)

          # Restore verification explicitly includes the two stores that caused the false failure.
          verify = re.search(r'async function verifyRestoredContent\(expected\) \{([\s\S]*?)\n\}', app)
          assert verify and '"moments"' in verify.group(1) and '"randomThoughts"' in verify.group(1)

          # Cloud metadata is checked before the replacement transaction begins.
          apply = re.search(r'async function applyCloudRestorePayload\(payload\) \{([\s\S]*?)\n\}', app)
          assert apply and 'invalid-cloud-backup:record-count' in apply.group(1)
          assert apply.group(1).index('invalid-cloud-backup:record-count') < apply.group(1).index('replaceContent')

          assert 'window.fuwaRestoreSafetyBackup = restoreSafetyBackup;' in app
          assert 'await window.fuwaRestoreSafetyBackup(safetyBackup);' in fb
          assert 'Restoring device safety copy…' in fb

          # No destructive database/storage shortcuts were introduced.
          for token in ('localStorage.clear(', 'indexedDB.deleteDatabase('):
              assert app.count(token) <= old_app.count(token), token

          # No new duplicate static HTML IDs.
          def dups(text):
              ids = re.findall(r'\bid="([^"]+)"', text)
              return {k:v for k,v in collections.Counter(ids).items() if v > 1}
          assert dups(html) == dups(old_html)

          # Production patch scope must remain narrow.
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == {'app.js','firebase-fuwa.js','index.html','service-worker.js'}, changed
          for path in ('style.css','manifest.json','data/scrapbook-data.js','data/scrapbook-data.json'):
              subprocess.run(['git','diff','--exit-code','HEAD','--',path], check=True)
          subprocess.run(['git','diff','--exit-code','HEAD','--','audio','icon'], check=True)
          print('static/data-safety/restore-source QA passed')
          PY
          git diff --check

      - name: Install Chromium QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Cloud restore regression and rollback QA
        run: |
          set -euo pipefail
          python3 -m http.server 4197 --bind 127.0.0.1 >/tmp/fuwa-v94-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep .4
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const CLOUD_STORES = [
            'entries','tinyJoys','letters','moodCheckins','threads','bookmarks','nightlyReflections','thenNow',
            'comfortItems','unsentLetters','thoughtBubbles','dreams','dailyCheckins','lifeCollections','habitDefinitions',
            'moments','randomThoughts'
          ];

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:390,height:844}, serviceWorkers:'block'});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            await page.addInitScript(()=>{
              localStorage.setItem('fuwaLocalModeV1','1');
              localStorage.setItem('fuwaTutorialSeenV1','1');
            });
            await page.goto('http://127.0.0.1:4197/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => typeof window.fuwaCreateCloudBackupPayload === 'function' && typeof window.fuwaApplyCloudRestorePayload === 'function' && typeof window.fuwaRestoreSafetyBackup === 'function', null, {timeout:8000});
            await page.waitForTimeout(200);
            assert(!errors.length, `startup page errors: ${errors.join(' | ')}`);

            const result = await page.evaluate(async (stores) => {
              const blankPayload = async () => {
                const base = await window.fuwaCreateCloudBackupPayload();
                stores.forEach(k => base.data[k] = []);
                base.backupFormat = 'fuwa-cloud-v1';
                return base;
              };

              // Exact screenshot regression: recordCount includes Moments + Random Thoughts.
              const cloud = await blankPayload();
              cloud.data.moments = [{id:'qa-cloud-moment', text:'Cloud moment', createdAt:'2026-08-14T10:00:00.000Z'}];
              cloud.data.randomThoughts = [{id:'qa-cloud-thought', text:'Cloud thought', createdAt:'2026-08-14T10:00:01.000Z'}];
              cloud.recordCount = 2;
              const restore = await window.fuwaApplyCloudRestorePayload(cloud);
              const afterCloud = await window.fuwaCreateCloudBackupPayload();

              // Capture the exact device state, replace it, then prove rollback returns the original IDs.
              const safety = await window.fuwaCreateRestoreSafetyBackup();
              const replacement = await blankPayload();
              replacement.data.moments = [{id:'qa-replacement', text:'Replacement', createdAt:'2026-08-14T10:01:00.000Z'}];
              replacement.recordCount = 1;
              await window.fuwaApplyCloudRestorePayload(replacement);
              const rollback = await window.fuwaRestoreSafetyBackup(safety);
              const afterRollback = await window.fuwaCreateCloudBackupPayload();

              // A mismatched declared count must fail before changing IndexedDB.
              const invalid = await blankPayload();
              invalid.data.moments = [{id:'qa-invalid', text:'Should never write', createdAt:'2026-08-14T10:02:00.000Z'}];
              invalid.recordCount = 99;
              let invalidError = '';
              try { await window.fuwaApplyCloudRestorePayload(invalid); }
              catch (error) { invalidError = String(error?.message || error); }
              const afterInvalid = await window.fuwaCreateCloudBackupPayload();

              return {
                restore,
                cloudCount: afterCloud.recordCount,
                cloudMomentIds: afterCloud.data.moments.map(x=>x.id),
                cloudThoughtIds: afterCloud.data.randomThoughts.map(x=>x.id),
                rollback,
                rollbackCount: afterRollback.recordCount,
                rollbackMomentIds: afterRollback.data.moments.map(x=>x.id),
                rollbackThoughtIds: afterRollback.data.randomThoughts.map(x=>x.id),
                invalidError,
                afterInvalidCount: afterInvalid.recordCount,
                afterInvalidMomentIds: afterInvalid.data.moments.map(x=>x.id),
                afterInvalidThoughtIds: afterInvalid.data.randomThoughts.map(x=>x.id),
              };
            }, CLOUD_STORES);

            assert(result.restore?.ok === true && result.restore.recordCount === 2, `valid restore failed ${JSON.stringify(result.restore)}`);
            assert(result.cloudCount === 2, `cloud record count wrong ${result.cloudCount}`);
            assert(result.cloudMomentIds.includes('qa-cloud-moment'), 'Moment did not persist');
            assert(result.cloudThoughtIds.includes('qa-cloud-thought'), 'Random Thought did not persist');
            assert(result.rollback?.ok === true && result.rollback.recordCount === 2, 'safety rollback failed');
            assert(result.rollbackMomentIds.includes('qa-cloud-moment') && !result.rollbackMomentIds.includes('qa-replacement'), 'rollback did not restore Moment IDs');
            assert(result.rollbackThoughtIds.includes('qa-cloud-thought'), 'rollback did not restore Random Thought IDs');
            assert(result.invalidError.includes('invalid-cloud-backup:record-count'), `count preflight did not reject mismatch: ${result.invalidError}`);
            assert(result.afterInvalidCount === 2, `invalid payload changed record count ${result.afterInvalidCount}`);
            assert(result.afterInvalidMomentIds.includes('qa-cloud-moment') && !result.afterInvalidMomentIds.includes('qa-invalid'), 'invalid payload mutated device data');
            assert(result.afterInvalidThoughtIds.includes('qa-cloud-thought'), 'invalid payload changed Random Thoughts');
            assert(!errors.length, `runtime errors after restore QA: ${errors.join(' | ')}`);

            await context.close();
            await browser.close();
            console.log('cloud restore / rollback / preflight regression QA passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Responsive startup and navigation smoke QA
        run: |
          set -euo pipefail
          python3 -m http.server 4198 --bind 127.0.0.1 >/tmp/fuwa-v94-responsive.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep .4
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          const sizes=[[320,700],[375,812],[390,844],[430,932],[768,1024],[1024,768],[820,1180],[1180,820],[834,1194],[1194,834],[1024,1366],[1366,1024]];
          (async()=>{const b=await chromium.launch({headless:true});for(const [w,h] of sizes){const c=await b.newContext({viewport:{width:w,height:h},serviceWorkers:'block'}),p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.addInitScript(()=>{localStorage.setItem('fuwaLocalModeV1','1');localStorage.setItem('fuwaTutorialSeenV1','1')});await p.goto('http://127.0.0.1:4198/index.html',{waitUntil:'domcontentloaded'});await p.waitForTimeout(180);assert(!errors.length,`${w}x${h}: ${errors.join('|')}`);const g=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,nodes:document.getElementsByTagName('*').length,nav:getComputedStyle(document.querySelector('.bottom-nav')).position,bottom:document.querySelector('.bottom-nav').getBoundingClientRect().bottom}));assert(g.sw<=g.iw+2,`${w}x${h}: overflow`);assert(g.nodes<9000,`${w}x${h}: runaway DOM`);assert(g.nav==='fixed',`${w}x${h}: nav not fixed`);assert(Math.abs(g.bottom-h)<4,`${w}x${h}: nav bottom mismatch`);for(const v of ['home','entries','letters','me']){await p.evaluate(v=>document.querySelector(`[data-nav="${v}"]`)?.click(),v);await p.waitForTimeout(20)}assert(!errors.length,`${w}x${h}: navigation runtime error`);await c.close()}await b.close();console.log('12-size startup/navigation smoke QA passed')})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Build clean package contents
        run: |
          set -euo pipefail
          mkdir -p dist/changes dist/full/Fuwa
          cp index.html app.js firebase-fuwa.js service-worker.js dist/changes/
          cp index.html style.css app.js manifest.json service-worker.js firebase-fuwa.js dist/full/Fuwa/
          cp -R audio data icon dist/full/Fuwa/
          test ! -e dist/full/Fuwa/.github
          test ! -e dist/full/Fuwa/tools
          find dist/changes -type f | sort
          find dist/full/Fuwa -maxdepth 3 -type f | sort

      - name: Upload changes-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v94-cloud-restore-fix
          path: dist/changes
          retention-days: 1

      - name: Upload full clean production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v94-full-clean-production
          path: dist/full/Fuwa
          retention-days: 1
