.sanctuary-companion-name-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.sanctuary-companion-name-row input{min-width:0;height:43px;border:1px solid #eadce2;border-radius:13px;background:#fff;color:#604c55;padding:0 12px;outline:none}.sanctuary-companion-name-row button{min-width:70px;border:0;border-radius:13px;background:#f7dce7;color:#9e5772;font-size:9px;font-weight:900}
.sanctuary-decor-details{margin-top:19px;border:1px solid #eadde2;border-radius:17px;background:rgba(255,255,255,.55);overflow:hidden}.sanctuary-decor-details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}.sanctuary-decor-details summary::-webkit-details-marker{display:none}.sanctuary-decor-details summary span{display:grid;gap:2px}.sanctuary-decor-details summary strong{font-size:10px}.sanctuary-decor-details summary small{color:var(--muted);font-size:8px}.sanctuary-decor-details summary b{font-size:14px;color:#a56d80;transition:transform .16s ease}.sanctuary-decor-details[open] summary b{transform:rotate(180deg)}.sanctuary-decor-details .sanctuary-object-options{padding:0 10px 11px}
.sanctuary-stage-timeline{display:grid;gap:7px}.sanctuary-stage-step{display:grid;grid-template-columns:36px 1fr;gap:9px;align-items:center;padding:10px;border:1px solid #eee2e6;border-radius:15px;background:rgba(255,255,255,.55);opacity:.62}.sanctuary-stage-step>span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#f4edf0;color:#9c8790;font-size:8px;font-weight:900}.sanctuary-stage-step strong,.sanctuary-stage-step small{display:block}.sanctuary-stage-step strong{font-family:Georgia,"Times New Roman",serif;font-size:12px}.sanctuary-stage-step small{margin-top:2px;color:var(--muted);font-size:8px;line-height:1.35}.sanctuary-stage-step.reached{opacity:1}.sanctuary-stage-step.reached>span{background:#f8dce7;color:#a45773}.sanctuary-stage-step.current{border-color:#e6b2c3;background:#fff6f9;box-shadow:0 5px 15px rgba(157,86,111,.07)}.sanctuary-v3-unlocks-wrap{margin-top:20px}

/* The room itself */
.sanctuary-v3-scene{height:390px;background:linear-gradient(#f8eef5 0 65%,#ead5ca 65%);isolation:isolate}.sanctuary-v3-scene .room-window{z-index:2}.sanctuary-v3-scene .room-rug,.sanctuary-v3-scene .room-bed,.sanctuary-v3-scene .sanctuary-memory-object{z-index:4}.sanctuary-v3-scene .room-sky{position:relative;overflow:hidden;transition:background .3s ease}.room-sun,.room-moon-sky{position:absolute;display:block;border-radius:50%;transition:opacity .25s ease}.room-sun{width:23px;height:23px;right:13px;top:15px;background:#ffe5a9;box-shadow:0 0 18px rgba(255,224,154,.55)}.room-moon-sky{width:20px;height:20px;right:14px;top:14px;background:#fff5d7;box-shadow:-5px 2px 0 #c5c8e7;opacity:0}.room-rain-lines{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(105deg,transparent 0 10px,rgba(126,162,187,.34) 11px 12px,transparent 13px 21px);transform:translateY(-8px)}
.ambience-morning .room-sky{background:linear-gradient(#d9ecf7,#f7dce6)}.ambience-day .room-sky{background:linear-gradient(#bfe2f4,#f8eef0)}.ambience-golden .room-sky{background:linear-gradient(#f5cfc8,#f8e5c6)}.ambience-night .room-sky{background:linear-gradient(#7f83ae,#c4aac7)}.ambience-rain .room-sky{background:linear-gradient(#b9c9d5,#d6cbd7)}.ambience-night .room-sun,.ambience-rain .room-sun{opacity:0}.ambience-night .room-moon-sky{opacity:1}.ambience-rain .room-rain-lines{opacity:1;animation:sanctuaryRain 1.8s linear infinite}
.room-curtain{position:absolute;z-index:3;top:20px;width:20px;height:145px;border-radius:12px;background:linear-gradient(90deg,#edcbd6,#f8e4eb);box-shadow:inset -3px 0 5px rgba(126,84,100,.08)}.room-curtain-left{left:17px;transform:skewY(-3deg)}.room-curtain-right{left:124px;transform:skewY(3deg)}.sanctuary-theme-lavender .room-curtain{background:linear-gradient(90deg,#d9d0eb,#eee7f7)}.sanctuary-theme-sky .room-curtain{background:linear-gradient(90deg,#d6e9f0,#eef7fa)}
.room-season-particles{position:absolute;z-index:5;inset:0;pointer-events:none;overflow:hidden}.room-season-particles i{display:none;position:absolute;width:7px;height:7px;top:-10px;border-radius:60% 40% 60% 40%;opacity:.72}.season-spring .room-season-particles i{display:block;background:#efb8c9;animation:sanctuaryFall 8s linear infinite}.season-summer .room-season-particles i{display:block;width:4px;height:4px;border-radius:50%;background:#ffe9a6;box-shadow:0 0 7px #ffe9a6;animation:sanctuaryGlow 3.2s ease-in-out infinite}.season-autumn .room-season-particles i{display:block;background:#dca678;animation:sanctuaryFall 9s linear infinite}.season-winter .room-season-particles i{display:block;border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(255,255,255,.8);animation:sanctuaryFall 10s linear infinite}.room-season-particles i:nth-child(1){left:14%;animation-delay:-1s}.room-season-particles i:nth-child(2){left:29%;animation-delay:-5s}.room-season-particles i:nth-child(3){left:47%;animation-delay:-3s}.room-season-particles i:nth-child(4){left:63%;animation-delay:-7s}.room-season-particles i:nth-child(5){left:79%;animation-delay:-2s}.room-season-particles i:nth-child(6){left:91%;animation-delay:-6s}
.sanctuary-v3-scene .room-cloud-pet small{position:absolute;left:50%;top:48px;transform:translateX(-50%);padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.72);color:#9a7583;font-size:6px;font-weight:800;white-space:nowrap;pointer-events:none}.sanctuary-v3-scene .room-cloud-pet.mood-tired{filter:saturate(.82)}.sanctuary-v3-scene .room-cloud-pet.mood-sad{filter:hue-rotate(20deg) saturate(.72)}.sanctuary-v3-scene .room-cloud-pet.mood-angry{filter:hue-rotate(-12deg) saturate(1.08)}
