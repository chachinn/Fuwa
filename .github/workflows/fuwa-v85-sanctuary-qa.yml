name: Fuwa v85 Sanctuary QA

on:
  push:
    branches:
      - fuwa-v85-sanctuary-qa

permissions:
  contents: write

jobs:
  sanctuary-build-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fuwa-v85-sanctuary-qa
          fetch-depth: 0

      - name: Apply Sanctuary expansion
        run: python .github/fuwa_v85_patch.py

      - name: Run release QA
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check data/scrapbook-data.js
          python -m json.tool manifest.json >/dev/null
          python .github/fuwa_v85_verify.py
          git diff --exit-code origin/main -- firebase-fuwa.js manifest.json data/scrapbook-data.js

      - name: Commit verified Sanctuary build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Fuwa QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fuwa-v85-sanctuary-qa.yml .github/fuwa_v85_patch.py .github/fuwa_v85_verify.py
          git add app.js index.html style.css service-worker.js
          git commit -m "Expand Fuwa Sanctuary into a living room v85"
          git push origin HEAD:fuwa-v85-sanctuary-qa
