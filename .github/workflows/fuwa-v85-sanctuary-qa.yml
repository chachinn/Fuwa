.room-blanket{position:absolute;left:118px;bottom:75px;width:92px;height:40px;border:0;border-radius:10px 17px 8px 16px;background:repeating-linear-gradient(135deg,#f2cad8 0 10px,#eadbec 10px 20px);opacity:.95;transform:rotate(-2deg)}
.room-flowers{position:absolute;left:31px;bottom:73px;width:32px;height:47px;border:0;background:transparent}.room-flowers::before{content:"✿ ✿";position:absolute;left:-5px;top:-5px;color:#e58fab;font-size:17px;letter-spacing:-5px}.room-flowers::after{content:"";position:absolute;left:8px;bottom:0;width:18px;height:24px;border-radius:5px 5px 10px 10px;background:#d9b9cf;box-shadow:inset 0 0 0 1px rgba(119,78,94,.08)}
.room-dream-mobile{position:absolute;right:48px;top:34px;width:45px;height:55px;border:0;background:transparent}.room-dream-mobile::before{content:"☾";position:absolute;left:12px;top:0;color:#f4d9a0;font-size:25px;text-shadow:0 2px 8px rgba(247,220,157,.4)}.room-dream-mobile::after{content:"·  ✦  ·";position:absolute;left:-1px;top:29px;color:#d6badf;font-size:12px;letter-spacing:2px}
.room-floating-notes{position:absolute;right:97px;top:78px;width:45px;height:34px;border:0;background:transparent}.room-floating-notes::before,.room-floating-notes::after{content:"";position:absolute;width:20px;height:16px;border-radius:3px;background:#f8e5a9;box-shadow:0 2px 5px rgba(104,78,87,.08)}.room-floating-notes::before{left:0;top:0;transform:rotate(-8deg)}.room-floating-notes::after{right:0;bottom:0;background:#efd5e6;transform:rotate(7deg)}
.room-album{position:absolute;right:20px;bottom:28px;width:42px;height:33px;border:0;border-radius:4px;background:#c9b8d8;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),0 3px 7px rgba(77,57,66,.08)}.room-album::after{content:"♡";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px}
.sanctuary-object-dot.desk{background:#cda995}.sanctuary-object-dot.blanket{background:#eecada}.sanctuary-object-dot.flowers{background:#e99bb5}.sanctuary-object-dot.moon{background:#e8d8a8}.sanctuary-object-dot.notes{background:#f4dda1}.sanctuary-object-dot.album{background:#c8b6da}
@keyframes sanctuaryFall{from{transform:translate3d(0,-12px,0) rotate(0)}to{transform:translate3d(18px,410px,0) rotate(210deg)}}@keyframes sanctuaryGlow{0%,100%{opacity:.25;transform:translateY(40px)}50%{opacity:.95;transform:translateY(185px)}}@keyframes sanctuaryRain{from{transform:translateY(-14px)}to{transform:translateY(14px)}}
@media(max-width:390px){.sanctuary-companion-card{grid-template-columns:42px minmax(0,1fr)}.sanctuary-companion-card>button{grid-column:1/-1;width:100%}.sanctuary-memory-shelf{grid-template-columns:1fr 1fr}.sanctuary-room-stats{grid-template-columns:1fr 1fr}.sanctuary-season-options{grid-template-columns:repeat(3,1fr)}.sanctuary-v3-scene{height:370px}.sanctuary-v3-option{min-height:50px}}
@media(prefers-reduced-motion:reduce){.room-season-particles i,.ambience-rain .room-rain-lines{animation:none!important}.room-season-particles i{transform:translateY(90px)}.sanctuary-v3-panel{animation:none}}
'''
          css = css.rstrip() + '\n' + v85_css.strip() + '\n'

          app = app.replace('const FUWA_RELEASE_KEY = "fuwa-v1.0.2-2026-08-13";', 'const FUWA_RELEASE_KEY = "fuwa-v1.1.0-2026-08-13";', 1)
          sw = sw.replace('const CACHE_NAME = "fuwa-shell-v84";', 'const CACHE_NAME = "fuwa-shell-v85";', 1)
          sw = sw.replace('const RELEASE_KEY = "fuwa-v1.0.2-2026-08-13";', 'const RELEASE_KEY = "fuwa-v1.1.0-2026-08-13";', 1)

          app_path.write_text(app, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Run release QA
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check data/scrapbook-data.js
          python -m json.tool manifest.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          app = Path('app.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('style.css').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')

          assert '<!-- FUWA_BUILD: v85-sanctuary-expansion-qa -->' in html
          assert 'const DATABASE_VERSION = 13;' in app
          assert app.count('function renderSanctuaryLegacy(force=false) {') == 1
          assert app.count('function renderSanctuary(force=false) {') == 1
          assert 'function sanctuaryV3MomentCount()' in app
          assert 'function sanctuaryV3RenderShelf()' in app
          assert 'renderMonthlyStory();\n  renderEmotionalWeather();\n  renderSanctuary();\n}' not in app
          assert 'const FUWA_RELEASE_KEY = "fuwa-v1.1.0-2026-08-13";' in app
          assert 'const CACHE_NAME = "fuwa-shell-v85";' in sw
          assert 'const RELEASE_KEY = "fuwa-v1.1.0-2026-08-13";' in sw
          for required in [
              'sanctuaryPanelMemories','sanctuaryPanelCustomize','sanctuaryPanelStory',
              'sanctuaryMemoryShelf','sanctuaryAmbienceOptions','sanctuarySeasonOptions',
              'sanctuaryPresetOptions','sanctuaryCompanionName','sanctuaryStageTimeline'
          ]:
              assert f'id="{required}"' in html, required

          funcs = re.findall(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', app)
          duplicates = sorted({name for name in funcs if funcs.count(name) > 1})
          assert not duplicates, f'duplicate functions: {duplicates}'

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value: self.ids.append(value)
          parser = IdParser(); parser.feed(html)
          duplicate_ids = sorted({i for i in parser.ids if parser.ids.count(i) > 1})
          assert not duplicate_ids, f'duplicate ids: {duplicate_ids}'

          view_ids = set(re.findall(r'id="([A-Za-z0-9_-]+)View"', html))
          nav_targets = set(re.findall(r'data-nav="([A-Za-z0-9_-]+)"', html))
          missing = sorted(target for target in nav_targets if target not in view_ids)
          assert not missing, f'missing nav views: {missing}'

          assert css.count('{') == css.count('}'), 'CSS brace imbalance'
          assert '@media(prefers-reduced-motion:reduce)' in css
          assert '.sanctuary-v3-tabs' in css and '.room-dream-mobile' in css
          print('Fuwa v85 Sanctuary QA PASS')
          PY

          # Release must not touch cloud configuration, manifest, or scrapbook dataset.
          git diff --exit-code origin/main -- firebase-fuwa.js manifest.json data/scrapbook-data.js

      - name: Commit verified Sanctuary build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Fuwa QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fuwa-v85-sanctuary-qa.yml
          git add app.js index.html style.css service-worker.js
          git commit -m "Expand Fuwa Sanctuary into a living room v85"
          git push origin HEAD:fuwa-v85-sanctuary-qa
