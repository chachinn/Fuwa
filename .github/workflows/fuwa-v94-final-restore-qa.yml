name: Fuwa v94 final cloud restore QA

on:
  push:
    branches:
      - qa/v94-cloud-restore-fix

jobs:
  final-restore-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v94-cloud-restore-fix
          fetch-depth: 0

      - name: Apply corrected production patch
        run: |
          python3 tools/fuwa_v94_restore_patch.py
          python3 tools/fuwa_v94_restore_patch_repair.py

      - name: Static and data-safety QA
        run: |
          set -euo pipefail
          node --check app.js
          node --check firebase-fuwa.js
          node --check service-worker.js
          node --check data/scrapbook-data.js
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,collections
          app=Path('app.js').read_text(encoding='utf-8')
          fb=Path('firebase-fuwa.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          old_app=subprocess.check_output(['git','show','HEAD:app.js'],text=True)
          old_html=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          assert 'const DATABASE_VERSION = 13;' in app
          assert 'fuwa-v1.1.9-2026-08-14' in app
          assert 'FUWA_BUILD: v94-cloud-restore-safety-qa' in html
          assert 'What’s new in Fuwa 1.1.9' in html
          assert 'fuwa-shell-v94' in sw and 'fuwa-v1.1.9-2026-08-14' in sw
          assert 'return cloudBackupRecordCount(data);' in app
          verify=re.search(r'async function verifyRestoredContent\(expected\) \{([\s\S]*?)\n\}',app)
          assert verify and '"moments"' in verify.group(1) and '"randomThoughts"' in verify.group(1)
          restore=re.search(r'async function restoreSafetyBackup\(payload\) \{([\s\S]*?)\n\}',app)
          assert restore and 'validateThreads' in restore.group(1) and 'validateNightlyReflections' in restore.group(1)
          assert 'validateUnsentLetters' not in restore.group(1)
          apply=re.search(r'async function applyCloudRestorePayload\(payload\) \{([\s\S]*?)\n\}',app)
          assert apply and apply.group(1).index('invalid-cloud-backup:record-count') < apply.group(1).index('replaceContent')
          assert 'await window.fuwaRestoreSafetyBackup(safetyBackup);' in fb
          assert 'Restoring device safety copy…' in fb
          for token in ('localStorage.clear(','indexedDB.deleteDatabase('): assert app.count(token)<=old_app.count(token)
          def dups(t):
            ids=re.findall(r'\bid="([^"]+)"',t); return {k:v for k,v in collections.Counter(ids).items() if v>1}
          assert dups(html)==dups(old_html)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'app.js','firebase-fuwa.js','index.html','service-worker.js'},changed
          subprocess.run(['git','diff','--exit-code','HEAD','--','style.css','manifest.json','audio','data','icon'],check=True)
          print('static/data-safety QA passed')
          PY
          git diff --check

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Exact restore-count, rollback, and preflight regression QA
        run: |
          set -euo pipefail
          python3 -m http.server 4201 --bind 127.0.0.1 >/tmp/fuwa-v94-final.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT; sleep .4
          node - <<'JS'
          const {chromium}=require('playwright'); const assert=(x,m)=>{if(!x)throw new Error(m)};
          const stores=['entries','tinyJoys','letters','moodCheckins','threads','bookmarks','nightlyReflections','thenNow','comfortItems','unsentLetters','thoughtBubbles','dreams','dailyCheckins','lifeCollections','habitDefinitions','moments','randomThoughts'];
          (async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:390,height:844},serviceWorkers:'block'}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.addInitScript(()=>{localStorage.setItem('fuwaLocalModeV1','1');localStorage.setItem('fuwaTutorialSeenV1','1')});await p.goto('http://127.0.0.1:4201/index.html',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>typeof fuwaCreateCloudBackupPayload==='function'&&typeof fuwaApplyCloudRestorePayload==='function'&&typeof fuwaRestoreSafetyBackup==='function',null,{timeout:8000});
          const r=await p.evaluate(async stores=>{const blank=async()=>{const x=await fuwaCreateCloudBackupPayload();stores.forEach(k=>x.data[k]=[]);x.backupFormat='fuwa-cloud-v1';return x};const a=await blank();a.data.moments=[{id:'m-old',text:'Moment',createdAt:'2026-08-14T10:00:00Z'}];a.data.randomThoughts=[{id:'r-old',text:'Thought',createdAt:'2026-08-14T10:00:01Z'}];a.recordCount=2;const ok=await fuwaApplyCloudRestorePayload(a);const persisted=await fuwaCreateCloudBackupPayload();const safety=await fuwaCreateRestoreSafetyBackup();const b=await blank();b.data.moments=[{id:'m-new',text:'New',createdAt:'2026-08-14T10:01:00Z'}];b.recordCount=1;await fuwaApplyCloudRestorePayload(b);const rollback=await fuwaRestoreSafetyBackup(safety);const rolled=await fuwaCreateCloudBackupPayload();const bad=await blank();bad.data.moments=[{id:'bad',text:'Bad',createdAt:'2026-08-14T10:02:00Z'}];bad.recordCount=99;let error='';try{await fuwaApplyCloudRestorePayload(bad)}catch(e){error=String(e?.message||e)}const afterBad=await fuwaCreateCloudBackupPayload();return{ok,persisted,rollback,rolled,error,afterBad}},stores);
          assert(r.ok?.ok&&r.ok.recordCount===2,'valid restore failed');assert(r.persisted.recordCount===2,'persisted count wrong');assert(r.persisted.data.moments.some(x=>x.id==='m-old'),'moment missing');assert(r.persisted.data.randomThoughts.some(x=>x.id==='r-old'),'random thought missing');assert(r.rollback?.ok&&r.rollback.recordCount===2,'rollback failed');assert(r.rolled.data.moments.some(x=>x.id==='m-old')&&!r.rolled.data.moments.some(x=>x.id==='m-new'),'rollback moment mismatch');assert(r.rolled.data.randomThoughts.some(x=>x.id==='r-old'),'rollback thought mismatch');assert(r.error.includes('invalid-cloud-backup:record-count'),'bad metadata not rejected');assert(r.afterBad.recordCount===2&&!r.afterBad.data.moments.some(x=>x.id==='bad'),'bad payload changed device data');assert(!errs.length,`runtime errors ${errs.join('|')}`);await c.close();await b.close();console.log('restore-count/rollback/preflight QA passed')})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Phone and iPad responsive runtime QA
        run: |
          set -euo pipefail
          python3 -m http.server 4202 --bind 127.0.0.1 >/tmp/fuwa-v94-ui.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT; sleep .4
          node - <<'JS'
          const {chromium}=require('playwright');const assert=(x,m)=>{if(!x)throw new Error(m)};const sizes=[[320,700],[375,812],[390,844],[430,932],[768,1024],[1024,768],[820,1180],[1180,820],[834,1194],[1194,834],[1024,1366],[1366,1024]];(async()=>{const b=await chromium.launch({headless:true});for(const [w,h] of sizes){const c=await b.newContext({viewport:{width:w,height:h},serviceWorkers:'block'}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.addInitScript(()=>{localStorage.setItem('fuwaLocalModeV1','1');localStorage.setItem('fuwaTutorialSeenV1','1')});await p.goto('http://127.0.0.1:4202/index.html',{waitUntil:'domcontentloaded'});await p.waitForTimeout(180);const g=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,n:document.getElementsByTagName('*').length,pos:getComputedStyle(document.querySelector('.bottom-nav')).position,bottom:document.querySelector('.bottom-nav').getBoundingClientRect().bottom}));assert(!errs.length,`${w}x${h}: ${errs.join('|')}`);assert(g.sw<=g.iw+2,`${w}x${h}: overflow`);assert(g.n<9000,`${w}x${h}: DOM growth`);assert(g.pos==='fixed'&&Math.abs(g.bottom-h)<4,`${w}x${h}: bottom nav`);for(const v of ['home','entries','letters','me']){await p.evaluate(v=>document.querySelector(`[data-nav="${v}"]`)?.click(),v);await p.waitForTimeout(20)}assert(!errs.length,`${w}x${h}: nav runtime`);await c.close()}await b.close();console.log('12-size runtime QA passed')})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Build clean packages
        run: |
          set -euo pipefail
          mkdir -p dist/changes dist/full/Fuwa
          cp index.html app.js firebase-fuwa.js service-worker.js dist/changes/
          cp index.html style.css app.js manifest.json service-worker.js firebase-fuwa.js dist/full/Fuwa/
          cp -R audio data icon dist/full/Fuwa/
          test ! -e dist/full/Fuwa/.github && test ! -e dist/full/Fuwa/tools

      - name: Upload changes
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v94-cloud-restore-fix
          path: dist/changes
          retention-days: 1

      - name: Upload full clean production
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v94-full-clean-production
          path: dist/full/Fuwa
          retention-days: 1
