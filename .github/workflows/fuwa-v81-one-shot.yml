name: Fuwa v81 release QA

on:
  push:
    branches: [fuwa-v81-release-qa]

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fuwa-v81-release-qa
          fetch-depth: 0
      - name: Apply v81 patch
        shell: python
        run: |
          import base64,zlib
          exec(zlib.decompress(base64.b64decode("")).decode())
      - name: Run release QA
        shell: python
        run: |
          import base64,zlib
          exec(zlib.decompress(base64.b64decode("")).decode())
      - name: Commit verified v81 build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fuwa-v81-one-shot.yml
          git config user.name "ChatGPT Fuwa QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js .github/workflows/fuwa-v81-one-shot.yml
          git commit -m "Add Fuwa refresh notes and large-journal stability v81"
          git push origin HEAD:fuwa-v81-release-qa
