name: Fuwa v90 manual UI and sleep package QA

on:
  push:
    branches:
      - qa/v90-manual-ui-sleep-package
    paths:
      - .fuwa-v90-run

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v90-manual-ui-sleep-package
          fetch-depth: 0

      - name: Apply Fuwa v90 patch
        run: python3 tools/fuwa_v90_manual_patch.py

      - name: Static and data safety QA
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-fuwa.js
          node --check data/scrapbook-data.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest valid')"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          old_js=subprocess.check_output(['git','show','HEAD:app.js'],text=True)
          assert 'FUWA_BUILD: v90-home-sleep-nav-ui-qa' in html
          assert 'What’s new in Fuwa 1.1.5' in html
          assert 'fuwa-shell-v90' in sw
          assert 'fuwa-v1.1.5-2026-08-14' in sw and 'fuwa-v1.1.5-2026-08-14' in js
          assert 'FUWA V90 — HOME CLOUD MOODS + GROUNDED NAV + SLEEP PLAYER' in css
          assert re.search(r'const DATABASE_VERSION = 13;', js)
          for token in ('localStorage.clear(', 'indexedDB.deleteDatabase('):
              assert js.count(token) <= old_js.count(token), token
          for path in ('firebase-fuwa.js','manifest.json'):
              subprocess.run(['git','diff','--exit-code','HEAD','--',path],check=True)
          subprocess.run(['git','diff','--exit-code','HEAD','--','data','icon'],check=True)
          assert html.index('id="sleepPlayerCard"') < html.index('<p class="eyebrow">How long?</p>')
          for fn in ('buildRainSound','buildWaveSound','buildFireplaceSound','buildWindSound','buildForestSound','buildCafeSound','buildBrownNoise','buildWhiteNoise'):
              assert f'function {fn}()' in js
          assert 'sleepSoundSwitchToken' in js
          print('static/data-safety QA passed')
          PY
          git diff --check

      - name: Install browser QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Responsive browser and interaction QA
        run: |
          python3 -m http.server 4173 >/tmp/fuwa-v90-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/fuwa-v90-smoke.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const sizes=[
            {name:'iPhone small',width:320,height:568},
            {name:'iPhone standard',width:390,height:844},
            {name:'iPhone large',width:430,height:932},
            {name:'iPad portrait',width:820,height:1180},
            {name:'iPad landscape',width:1180,height:820}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const spec of sizes){
              const context=await browser.newContext({viewport:{width:spec.width,height:spec.height},isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.addInitScript(()=>localStorage.setItem('fuwaLocalModeV1','1'));
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(900);

              const home=await page.evaluate(()=>{
                const buttons=[...document.querySelectorAll('#moodPicker button')];
                const nav=document.querySelector('.bottom-nav')?.getBoundingClientRect();
                const circles=buttons.map(b=>{const r=b.getBoundingClientRect(),s=getComputedStyle(b);return {w:r.width,h:r.height,r:s.borderRadius}});
                return {overflow:document.documentElement.scrollWidth-window.innerWidth,navBottom:nav?window.innerHeight-nav.bottom:999,circles};
              });
              if(home.overflow>2) throw new Error(`${spec.name} home overflow ${home.overflow}`);
              if(Math.abs(home.navBottom)>2) throw new Error(`${spec.name} nav not bottom-attached: ${home.navBottom}`);
              if(home.circles.length!==6) throw new Error(`${spec.name} expected 6 mood choices`);
              for(const c of home.circles){
                if(Math.abs(c.w-c.h)>2) throw new Error(`${spec.name} mood not square ${JSON.stringify(c)}`);
                if(parseFloat(c.r)<c.w*.40) throw new Error(`${spec.name} mood not circular ${JSON.stringify(c)}`);
              }

              await page.evaluate(()=>document.querySelector('[data-nav="sleep"]')?.click());
              await page.waitForTimeout(250);
              const sleep=await page.evaluate(()=>{
                const player=document.querySelector('#sleepPlayerCard');
                const timer=[...document.querySelectorAll('#sleepView .sleep-section')].find(x=>x.textContent.includes('Sleep timer'));
                const sounds=[...document.querySelectorAll('[data-sleep-sound]')];
                return {overflow:document.documentElement.scrollWidth-window.innerWidth,playerBeforeTimer:!!(player&&timer&&(player.compareDocumentPosition(timer)&Node.DOCUMENT_POSITION_FOLLOWING)),soundCount:sounds.length};
              });
              if(sleep.overflow>2) throw new Error(`${spec.name} sleep overflow ${sleep.overflow}`);
              if(!sleep.playerBeforeTimer) throw new Error(`${spec.name} player is not above timer`);
              if(sleep.soundCount<8) throw new Error(`${spec.name} missing sleep sounds: ${sleep.soundCount}`);

              await page.locator('[data-sleep-sound="rain"]').click();
              const play=page.locator('#sleepPlayPauseButton');
              if(await play.count()){
                await play.click();
                await page.waitForTimeout(120);
                await page.locator('[data-sleep-sound="waves"]').click();
                await page.locator('[data-sleep-sound="forest"]').click();
                await page.locator('[data-sleep-sound="cafe"]').click();
                await page.waitForTimeout(1500);
                const stop=page.locator('#sleepStopButton');
                if(await stop.count()) await stop.click();
              }
              if(errors.length) throw new Error(`${spec.name} page errors: ${errors.join(' | ')}`);
              if(spec.width===390) await page.screenshot({path:'/tmp/fuwa-v90-home-sleep.png',fullPage:true});
              await context.close();
            }
            await browser.close();
            console.log('responsive/interaction QA passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/fuwa-v90-smoke.cjs

      - name: Prepare ready-to-copy production files
        run: |
          mkdir -p manual-package
          cp index.html style.css app.js service-worker.js manual-package/

      - name: Upload ready-to-copy Fuwa files
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v90-ready-to-copy
          path: manual-package/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Fuwa-v90-QA-screenshot
          path: /tmp/fuwa-v90-home-sleep.png
          if-no-files-found: warn
          retention-days: 1
