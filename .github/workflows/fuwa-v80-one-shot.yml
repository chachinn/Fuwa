name: Fuwa v80 one-shot QA

on:
  push:
    branches:
      - fuwa-v80-qa

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fuwa-v80-qa
          fetch-depth: 0

      - name: Apply v80 stability fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path("app.js")
          html_path = Path("index.html")
          sw_path = Path("service-worker.js")

          app = app_path.read_text(encoding="utf-8")
          html = html_path.read_text(encoding="utf-8")
          sw = sw_path.read_text(encoding="utf-8")

          old = '''let moodCheckinSaving = false;
          let homeMoodSyncRunning = false;
          let pendingHomeMoodSync = "";
          let moodJarPhysicsFrame = null;'''
          new = '''let moodCheckinSaving = false;
          let homeMoodSyncRunning = false;
          let pendingHomeMoodSync = "";
          let moodPersistenceChain = Promise.resolve();
          let moodJarPhysicsFrame = null;'''
          if old not in app:
              raise SystemExit("Mood globals anchor not found; refusing to patch an unexpected app.js")
          app = app.replace(old, new, 1)

          needle = '''  return { record, existed: !!existing };
          }

          async function syncHomeMoodToJar(mood) {'''
          replacement = '''  return { record, existed: !!existing };
          }

          function queueTodayMoodPersistence(mood) {
            const run = () => persistTodayMoodCheckin(mood);
            const queued = moodPersistenceChain.catch(() => {}).then(run);
            moodPersistenceChain = queued.catch(() => {});
            return queued;
          }

          async function syncHomeMoodToJar(mood) {'''
          if needle not in app:
              raise SystemExit("Mood persistence insertion anchor not found")
          app = app.replace(needle, replacement, 1)

          pattern = re.compile(r'''async function syncHomeMoodToJar\(mood\) \{.*?\n\}\n\nasync function saveMoodCheckin''', re.S)
          match = pattern.search(app)
          if not match:
              raise SystemExit("syncHomeMoodToJar block not found")

          sync = r'''async function syncHomeMoodToJar(mood) {
            if (!moodEmoji[mood]) return;

            const previousCheckin = getTodayMoodCheckin();
            const previousMood = previousCheckin?.mood || state.selectedMood || defaultState.selectedMood;

            // Update Home immediately, but serialize the actual IndexedDB write
            // with Mood Jar writes so both surfaces cannot race each other.
            state.selectedMood = mood;
            savePreferences();
            renderMoodPicker();
            showMoodReaction(mood, true);

            // Latest Home tap wins instead of queueing every intermediate tap.
            pendingHomeMoodSync = mood;
            if (homeMoodSyncRunning) return;

            homeMoodSyncRunning = true;
            let savedAny = false;

            try {
              while (pendingHomeMoodSync) {
                const nextMood = pendingHomeMoodSync;
                pendingHomeMoodSync = "";
                await queueTodayMoodPersistence(nextMood);
                savedAny = true;
              }

              renderMoodPicker();
              renderHomeMoodJar();
              renderStats();
              if (currentView === "moodjar") renderMoodJarView();

              if (savedAny) toast("Today's mood is tucked into your jar ☁️");
            } catch (error) {
              console.error("Could not sync Home mood to Mood Jar.", error);

              // Never leave Home showing a mood that failed to reach IndexedDB.
              const authoritative = getTodayMoodCheckin()?.mood || previousMood;
              state.selectedMood = authoritative;
              savePreferences();
              renderMoodPicker();
              renderHomeMoodJar();
              if (currentView === "moodjar") renderMoodJarView();

              toast("Fuwa couldn't add that mood to the jar. Your previous mood was kept.");
            } finally {
              homeMoodSyncRunning = false;

              if (pendingHomeMoodSync) {
                const queuedMood = pendingHomeMoodSync;
                pendingHomeMoodSync = "";
                syncHomeMoodToJar(queuedMood);
              }
            }
          }

          async function saveMoodCheckin'''
          app = app[:match.start()] + sync + app[match.end():]

          old_modal = '''    await persistTodayMoodCheckin(mood);

              $("moodCheckinModal").classList.add("hidden");'''
          new_modal = '''    await queueTodayMoodPersistence(mood);

              $("moodCheckinModal").classList.add("hidden");'''
          if old_modal not in app:
              raise SystemExit("Mood Jar save call not found")
          app = app.replace(old_modal, new_modal, 1)

          old_prompt = '''function maybeShowDailyMoodCheckin() {
            if (getTodayMoodCheckin()) return;
            setTimeout(() => openMoodCheckin(), 350);
          }'''
          new_prompt = '''function maybeShowDailyMoodCheckin() {
            if (getTodayMoodCheckin() || homeMoodSyncRunning || pendingHomeMoodSync) return;
            setTimeout(() => {
              if (getTodayMoodCheckin() || homeMoodSyncRunning || pendingHomeMoodSync) return;
              openMoodCheckin();
            }, 350);
          }'''
          if old_prompt not in app:
              raise SystemExit("Daily mood prompt block not found")
          app = app.replace(old_prompt, new_prompt, 1)

          if '<!-- FUWA_BUILD: v79-mood-jar-sync-qa -->' not in html:
              raise SystemExit("Unexpected index build marker")
          html = html.replace(
              '<!-- FUWA_BUILD: v79-mood-jar-sync-qa -->',
              '<!-- FUWA_BUILD: v80-stability-qa -->',
              1,
          )

          if 'const CACHE_NAME = "fuwa-shell-v79";' not in sw:
              raise SystemExit("Unexpected service worker cache marker")
          sw = sw.replace(
              'const CACHE_NAME = "fuwa-shell-v79";',
              'const CACHE_NAME = "fuwa-shell-v80";',
              1,
          )

          app_path.write_text(app, encoding="utf-8")
          html_path.write_text(html, encoding="utf-8")
          sw_path.write_text(sw, encoding="utf-8")

      - name: Run release QA
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          python -m json.tool manifest.json >/dev/null
          node --check data/scrapbook-data.js
          python - <<'PY'
          from pathlib import Path
          import collections
          import re

          app = Path("app.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          duplicate_ids = {k:v for k,v in collections.Counter(ids).items() if v > 1}
          allowed = {
              "grad-amazing", "grad-good", "grad-neutral",
              "grad-tired", "grad-sad", "grad-angry",
          }
          unexpected = set(duplicate_ids) - allowed
          if unexpected:
              raise SystemExit(f"Unexpected duplicate IDs: {sorted(unexpected)}")

          funcs = re.findall(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', app)
          duplicate_funcs = {k:v for k,v in collections.Counter(funcs).items() if v > 1}
          if duplicate_funcs:
              raise SystemExit(f"Duplicate functions: {duplicate_funcs}")

          views = set(re.findall(r'id="([A-Za-z0-9_-]+)View"', html))
          navs = set(re.findall(r'data-nav="([A-Za-z0-9_-]+)"', html))
          nav_calls = set(re.findall(r'navigate\(["\']([^"\']+)["\']', app))
          if navs - views:
              raise SystemExit(f"Navigation targets missing views: {sorted(navs - views)}")
          if nav_calls - views:
              raise SystemExit(f"navigate() targets missing views: {sorted(nav_calls - views)}")

          if css.count("{") != css.count("}"):
              raise SystemExit("CSS braces are unbalanced")

          required = [
              'queueTodayMoodPersistence(nextMood)',
              'await queueTodayMoodPersistence(mood)',
              'fuwa-shell-v80',
          ]
          combined = app + "\n" + Path("service-worker.js").read_text(encoding="utf-8")
          for item in required:
              if item not in combined:
                  raise SystemExit(f"Missing required v80 marker: {item}")

          print("Fuwa v80 QA passed")
          print("Known pre-existing duplicate SVG gradient IDs:", duplicate_ids)
          PY

      - name: Commit verified v80 build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fuwa-v80-one-shot.yml
          git config user.name "ChatGPT Fuwa QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js .github/workflows/fuwa-v80-one-shot.yml
          git commit -m "Stabilize Fuwa mood sync and QA v80"
          git push origin HEAD:fuwa-v80-qa
