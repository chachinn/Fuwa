name: Fuwa v83 polish QA

on:
  push:
    branches: [fuwa-v83-polish-qa]

permissions:
  contents: write

jobs:
  polish-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fuwa-v83-polish-qa
          fetch-depth: 0

      - name: Apply calm UI polish
        shell: python
        run: |
          from pathlib import Path

          html_path = Path('index.html')
          app_path = Path('app.js')
          css_path = Path('style.css')
          sw_path = Path('service-worker.js')

          html = html_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          sw = sw_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          # Build / release identity.
          html = replace_once(html,
              '<!-- FUWA_BUILD: v82-update-handoff-qa -->',
              '<!-- FUWA_BUILD: v83-calm-polish-qa -->',
              'build marker')
          app = replace_once(app,
              'const FUWA_RELEASE_KEY = "fuwa-v1-2026-08-13";',
              'const FUWA_RELEASE_KEY = "fuwa-v1.0.1-2026-08-13";',
              'app release key')
          sw = replace_once(sw,
              'const CACHE_NAME = "fuwa-shell-v82";',
              'const CACHE_NAME = "fuwa-shell-v83";',
              'service worker cache')
          sw = replace_once(sw,
              'const RELEASE_KEY = "fuwa-v1-2026-08-13";',
              'const RELEASE_KEY = "fuwa-v1.0.1-2026-08-13";',
              'service worker release key')

          # Drawer: keep Start Here genuinely everyday. Move Scrapbook into
          # Journal & Memories and bring Nightly Wind-Down into Start Here.
          scrapbook_button = '<button class="drawer-menu-item" data-nav="scrapbook" type="button"><span class="drawer-item-icon scrapbook-drawer-icon">🎀</span><span><strong>Scrapbook</strong><small>Make little pages from photos, stickers, and memories.</small></span><b>›</b></button>'
          nightly_button = '<button class="drawer-menu-item" data-nav="nightly" type="button"><span class="drawer-item-icon drawer-night-icon"></span><span><strong>Nightly Wind-Down</strong><small>Put the day down gently.</small></span><b>›</b></button>'

          if html.count(scrapbook_button) != 1 or html.count(nightly_button) != 1:
              raise RuntimeError('drawer source buttons not found exactly once')
          html = html.replace(scrapbook_button, nightly_button, 1)

          journal_summary = '<summary><span>Journal & Memories</span><small>7 tools</small></summary>\n          <div class="drawer-menu-list">'
          journal_summary_new = '<summary><span>Journal & Memories</span><small>8 tools</small></summary>\n          <div class="drawer-menu-list">\n            ' + scrapbook_button
          html = replace_once(html, journal_summary, journal_summary_new, 'journal drawer group')

          comfort_old = '<summary><span>Comfort & Rest</span><small>5 tools</small></summary>\n          <div class="drawer-menu-list">\n            ' + nightly_button
          comfort_new = '<summary><span>Comfort & Rest</span><small>4 tools</small></summary>\n          <div class="drawer-menu-list">'
          html = replace_once(html, comfort_old, comfort_new, 'comfort drawer group')

          # Home: preserve every existing section but keep secondary content
          # under one native disclosure so first view stays calm and cheap to lay out.
          memory_threads_anchor = '''        <section class="section-block">\n          <div class="section-heading">\n            <div>\n              <p class="eyebrow">Stories that keep returning</p>\n              <h3>Memory Threads</h3>'''
          home_more_open = '''        <details class="home-more-panel" id="homeMorePanel">\n          <summary>\n            <span><strong>More from your garden</strong><small>Memories, calendar, wind-down & little things</small></span>\n            <b aria-hidden="true">⌄</b>\n          </summary>\n          <div class="home-more-content">\n\n''' + memory_threads_anchor
          html = replace_once(html, memory_threads_anchor, home_more_open, 'home disclosure start')

          home_more_tail = '''              <button class="little-things-see-all" id="randomThoughtSeeAllButton" type="button" data-nav="thoughts">See all →</button>\n            </article>\n          </div>\n        </section>\n      </section>\n\n\n      <section class="view" id="moodjarView">'''
          home_more_tail_new = '''              <button class="little-things-see-all" id="randomThoughtSeeAllButton" type="button" data-nav="thoughts">See all →</button>\n            </article>\n          </div>\n        </section>\n          </div>\n        </details>\n      </section>\n\n\n      <section class="view" id="moodjarView">'''
          html = replace_once(html, home_more_tail, home_more_tail_new, 'home disclosure end')

          # Fix the six long-standing duplicate SVG gradient IDs in the mood
          # check-in modal without touching the Home mood artwork.
          modal_marker = 'id="moodCheckinModal"'
          modal_pos = html.find(modal_marker)
          if modal_pos < 0:
              raise RuntimeError('mood check-in modal not found')
          head, tail = html[:modal_pos], html[modal_pos:]
          for mood in ('amazing','good','neutral','tired','sad','angry'):
              old_id = f'id="grad-{mood}"'
              old_url = f'url(#grad-{mood})'
              if tail.count(old_id) < 1 or tail.count(old_url) < 1:
                  raise RuntimeError(f'modal gradient {mood} not found')
              tail = tail.replace(old_id, f'id="grad-checkin-{mood}"', 1)
              tail = tail.replace(old_url, f'url(#grad-checkin-{mood})', 1)
          html = head + tail

          # Release notes describe this intentionally feature-free polish pass.
          html = replace_once(html,
              '<small>Fuwa 1.0 is ready. Refresh to update.</small>',
              '<small>Fuwa 1.0.1 is ready. Refresh to update.</small>',
              'update banner version')
          html = replace_once(html,
              '<h2 id="fuwaReleaseNotesTitle">What’s new in Fuwa v1</h2>',
              '<h2 id="fuwaReleaseNotesTitle">What’s new in Fuwa 1.0.1</h2>',
              'release title')
          html = replace_once(html,
              '<p class="fuwa-release-lead">A softer update flow, steadier mood check-ins, and lighter journal browsing.</p>',
              '<p class="fuwa-release-lead">No new features this time — just a calmer Fuwa that is easier to find your way around.</p>',
              'release lead')

          old_release_list = '''        <article><span>🌸</span><div><strong>Refresh when you’re ready</strong><p>Fuwa now waits for you to tap Refresh, then tells you what changed after the update opens.</p></div></article>\n        <article><span>🫙</span><div><strong>One mood, everywhere</strong><p>Your Home mood and Mood Jar stay synchronized with safer same-day saving.</p></div></article>\n        <article><span>📖</span><div><strong>Big journals feel lighter</strong><p>Entries render in small batches and search waits for you to finish typing before doing more work.</p></div></article>\n        <article><span>🛡️</span><div><strong>Stability polish</strong><p>Calendar lookups, update states, and background work were tightened without changing your data or Firebase setup.</p></div></article>'''
          new_release_list = '''        <article><span>☁️</span><div><strong>A calmer Home</strong><p>Your daily essentials stay up front. Secondary sections are still there, tucked under More from your garden.</p></div></article>\n        <article><span>🧭</span><div><strong>A clearer menu</strong><p>Daily Life, Mood Jar, and Nightly Wind-Down now lead Start Here. Scrapbook lives with Journal & Memories.</p></div></article>\n        <article><span>🌷</span><div><strong>Gentler navigation</strong><p>Focus states, tap targets, and the information hierarchy are more consistent without adding another feature.</p></div></article>\n        <article><span>🛡️</span><div><strong>QA cleanup</strong><p>Duplicate SVG IDs and structural checks were cleaned up while your database, Firebase setup, and existing content stayed unchanged.</p></div></article>'''
          html = replace_once(html, old_release_list, new_release_list, 'release list')

          # Keep the built-in Home tutorial accurate after the declutter.
          app = replace_once(app,
              'copy: "Use Home for the things you may want most often: a mood check-in, recent memories, Tiny Joys, Random Thoughts, and little pieces of your day.",',
              'copy: "Home keeps your daily essentials first. Your mood and Mood Jar stay visible, while the deeper pieces of your garden wait under one calm More section.",',
              'home tutorial copy')
          app = replace_once(app,
              '"Use Little Things for Tiny Joys and passing Random Thoughts.",',
              '"Open More from your garden for memories, calendar, Nightly Wind-Down, Tiny Joys, and Random Thoughts.",',
              'home tutorial step')

          # Lightweight CSS-only polish. No framework, animation system, or
          # data/render architecture changes.
          css += r'''\n\n/* =========================================================\n   FUWA V83 — CALM POLISH PASS\n   No new features: progressive disclosure + accessibility.\n   ========================================================= */\n.home-more-panel{\n  margin:18px 0 6px;\n  border:1px solid rgba(231,207,217,.88);\n  border-radius:22px;\n  background:rgba(255,251,253,.68);\n  overflow:hidden;\n}\n.home-more-panel>summary{\n  min-height:58px;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n  padding:12px 15px;\n  cursor:pointer;\n  list-style:none;\n  -webkit-user-select:none;\n  user-select:none;\n}\n.home-more-panel>summary::-webkit-details-marker{display:none}\n.home-more-panel>summary span{display:grid;gap:3px;min-width:0}\n.home-more-panel>summary strong{color:#694f5a;font-size:10px}\n.home-more-panel>summary small{color:#9b858e;font-size:7.5px;line-height:1.35}\n.home-more-panel>summary>b{\n  flex:0 0 auto;\n  display:grid;\n  place-items:center;\n  width:31px;\n  height:31px;\n  border-radius:50%;\n  background:#fff0f5;\n  color:#ad637e;\n  font-size:15px;\n  transition:transform .16s ease;\n}\n.home-more-panel[open]>summary>b{transform:rotate(180deg)}\n.home-more-content{\n  padding:0 13px 12px;\n  border-top:1px solid rgba(237,219,226,.72);\n}\n.home-more-content>.section-block{margin-top:16px}\n.home-more-content>.section-block:first-child{margin-top:13px}\n\n/* Consistent keyboard/focus visibility without changing the visual language. */\nbutton:focus-visible,\nsummary:focus-visible,\na:focus-visible,\ninput:focus-visible,\ntextarea:focus-visible,\nselect:focus-visible{\n  outline:3px solid rgba(211,113,148,.28);\n  outline-offset:2px;\n}\n.drawer-menu-item,\n.home-more-panel>summary,\n.life-tab-bar button,\n.journal-section-tabs button{\n  touch-action:manipulation;\n}\n\n@media (prefers-reduced-motion:reduce){\n  .home-more-panel>summary>b{transition:none}\n}\n'''

          html_path.write_text(html, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          sw_path.write_text(sw, encoding='utf-8')

      - name: Run release QA
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check data/scrapbook-data.js
          python - <<'PY'
          import json, re
          from collections import Counter
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          css = Path('style.css').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))

          assert 'FUWA_BUILD: v83-calm-polish-qa' in html
          assert 'const CACHE_NAME = "fuwa-shell-v83";' in sw
          assert 'fuwa-v1.0.1-2026-08-13' in app
          assert 'fuwa-v1.0.1-2026-08-13' in sw
          assert 'id="homeMorePanel"' in html
          assert html.count('data-nav="scrapbook"') >= 1
          assert html.count('data-nav="nightly"') >= 1
          assert '<summary><span>Journal & Memories</span><small>8 tools</small></summary>' in html
          assert '<summary><span>Comfort & Rest</span><small>4 tools</small></summary>' in html
          assert 'Fuwa 1.0.1 is ready. Refresh to update.' in html
          assert 'What’s new in Fuwa 1.0.1' in html

          # No duplicate DOM IDs after fixing the old mood SVG gradients.
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          dup_ids = {key: count for key, count in Counter(ids).items() if count > 1}
          assert not dup_ids, f'duplicate HTML IDs: {dup_ids}'

          # No duplicate named functions.
          funcs = re.findall(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', app)
          dup_funcs = {key: count for key, count in Counter(funcs).items() if count > 1}
          assert not dup_funcs, f'duplicate functions: {dup_funcs}'

          # Every data-nav target must have a corresponding view.
          navs = set(re.findall(r'data-nav="([^"]+)"', html))
          views = set(re.findall(r'id="([A-Za-z0-9_-]+)View"', html))
          missing = sorted(navs - views)
          assert not missing, f'missing navigation views: {missing}'

          # Structural / PWA checks.
          assert css.count('{') == css.count('}'), 'CSS brace imbalance'
          assert manifest.get('name') and manifest.get('start_url') is not None
          for asset in ('./index.html','./style.css','./app.js','./firebase-fuwa.js','./manifest.json'):
              assert asset in sw, f'missing core asset {asset}'

          # Preserve the current data schema and large-entry work.
          match = re.search(r'const DATABASE_VERSION\s*=\s*(\d+)', app)
          assert match and match.group(1) == '13', 'IndexedDB schema changed unexpectedly'
          assert '40' in app and 'Show more memories' in app, 'batched Entries rendering missing'
          assert '140' in app, 'debounced Entries search marker missing'

          print('Fuwa v83 polish QA passed')
          PY

      - name: Commit verified polish build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fuwa-v83-polish-qa.yml
          git config user.name "ChatGPT Fuwa QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js .github/workflows/fuwa-v83-polish-qa.yml
          git commit -m "Polish Fuwa navigation and calm home v83"
          git push origin HEAD:fuwa-v83-polish-qa